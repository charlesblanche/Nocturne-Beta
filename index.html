function openModal(title,content,wide=false){modal={title,wide};document.querySelector('#modalhost').innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal ${wide?'large':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button type="button" class="btn quiet sm" data-action="modal-close" aria-label="Close dialog">✕</button></div>${content}</div></div>`;document.querySelector('#modalhost .modal')?.focus();}
function closeModal(){cancelCharacterDeletion();modal=null;document.querySelector('#modalhost').innerHTML='';}
let characterDeletion=null, characterDeletionTimer=null;
function cancelCharacterDeletion(){
 if(characterDeletionTimer!==null){clearInterval(characterDeletionTimer);characterDeletionTimer=null}
 characterDeletion=null;
}
function openCharacterDeletion(id){
 const character=state.characters.find(x=>x.id===id);
 if(!character)return;
 closeModal();
 characterDeletion={id:character.id,readyAt:Date.now()+3000};
 const name=esc(character.name||'Unnamed character');
 openModal('Delete character',`<div class="stack"><p>Delete <b>${name}</b> permanently from this device?</p><p class="warning">This action cannot be undone. Export the character first if you want a backup.</p><p class="small" id="character-delete-countdown" aria-live="polite">Delete will be available in 3 seconds.</p><div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button type="button" class="btn danger" id="character-delete-confirm" data-action="delete-confirm" disabled>Delete in 3 s</button></div></div>`);
 const advanceCountdown=()=>{
  if(!characterDeletion||!document.querySelector('#character-delete-confirm')){cancelCharacterDeletion();return}
  const remaining=Math.max(0,Math.ceil((characterDeletion.readyAt-Date.now())/1000));
  const confirmButton=document.querySelector('#character-delete-confirm');
  const message=document.querySelector('#character-delete-countdown');
  confirmButton.disabled=remaining>0;
  confirmButton.textContent=remaining>0?`Delete in ${remaining} s`:'Delete character';
  if(message)message.textContent=remaining>0?`Delete will be available in ${remaining} second${remaining===1?'':'s'}.`:'You may now delete this character or cancel.';
  if(!remaining){clearInterval(characterDeletionTimer);characterDeletionTimer=null}
 };
 advanceCountdown();
 characterDeletionTimer=setInterval(advanceCountdown,100);
}
function confirmCharacterDeletion(){
 const pending=characterDeletion;
 if(!pending||Date.now()<pending.readyAt)return;
 const target=state.characters.find(c=>c.id===pending.id);

  case'set-hp':{let v=prompt('Current hit points (0–'+maxHP(c)+')',c.hp);if(v!==null)c.hp=clamp(v,0,maxHP(c));break}
  case'xp':c.xp=clamp(c.xp+step,0,5);break;
  case'condition':{let key=button.dataset.condition;c.conditions[key]=((c.conditions[key]||0)+1)%3;let full=CONDITIONS.every(k=>c.conditions[k]!==0);if(full&&c.conditions[key]===1){render();reachLimitModal();return}break}
  case'edit-profile':editProfile();return;
  case'edit-stats':editStats();return;
  case'adjust-defense':adjustDefense();return;
  case'edit-equipment':editEquipment();return;
  case'gm-grant-path':gmGrantPath();return;
  case'gm-grant-move':gmGrantMove();return;
  case'custom-move':editMove(id);return;
  case'item-add':editItem();return;
  case'item-edit':editItem(id);return;
  case'item-remove':if(confirm('Delete this item?'))c.items=c.items.filter(x=>x.id!==id);break;
  case'item-use':{let it=c.items.find(x=>x.id===id);if(it){let index=Number(button.dataset.index);it.spent=index<it.spent?index:index+1}break}
  case'item-reset':{let it=c.items.find(x=>x.id===id);if(it)it.spent=0;break}
  case'use-custom':{let m=c.customMoves.find(x=>x.id===id);if(m){let index=Number(button.dataset.index);m.spent=index<m.spent?index:index+1}break}
  case'struggle-edit':editStruggle();return;
  case'relation-add':editRelation();return;
  case'relation-edit':editRelation(id);return;
  case'relation-depth':{let r=c.relationships.find(x=>x.id===id);if(r)r.depth=clamp(r.depth+step,0,3);break}
  case'notes-edit':editNotes();return;
  case'journal-add':editJournal();return;
  case'path-filter':pathFilter=button.dataset.value;render();return;
  case'spell-filter':spellFilter=button.dataset.value;render();return;
  case'school':{const key=button.dataset.school,bonus=bonusSchools(c);if(bonus.includes(key)){banner('This school is automatically prepared by your acquired Path.');return}if(c.klass!=='Wizard'&&!c.classChoices.magicOverride)return;if(c.schools.includes(key))c.schools=c.schools.filter(x=>x!==key);else if(c.klass==='Wizard'&&c.schools.length>=3){banner('Wizards prepare three regular schools. Unselect another first.');return}else c.schools.push(key);break}
  case'magic-override':{c.classChoices.magicOverride=!c.classChoices.magicOverride;if(c.klass!=='Wizard')banner(c.classChoices.magicOverride?'GM spell-school overrides enabled.':'GM overrides disabled.');break}
  case'spell-add':editSpell();return;
  case'spell-edit':editSpell(id);return;
  case'respec':if(!confirm('Full respec will rebuild starting choices and reset acquired Paths, move selections, and equipment. Your level and story can be retained. Continue?'))return;openCreator(c,true);return;
  default:return;
 }
 render()}
function onFormChange(e){const el=e.target;if(!el)return;
 if(el.matches('#charSwitch')){state.activeId=el.value;tab='overview';render();return}
 if(draft&&document.querySelector('#creatorbody')){
  if(el.dataset.action==='select-class'){draftCapture();draft.klass=el.value;draft.statFocus=RULES[el.value].statsRule.choose[0];draft.stats=statsFor(el.value,draft.statFocus,{});draft.weapon='';draft.startItems=[];draft.schools=[];draft.classChoices={};renderCreator();return}
  if(el.dataset.draft==='statFocus'){draftCapture();draft.statFocus=el.value;draft.stats=statsFor(draft.klass,el.value,{});renderCreator();return}
 }
 if(advDraft&&el.dataset.action==='select-adv'){advDraft.type=el.value;advDraft.stat=null;advDraft.path=null;advDraft.move=null;renderAdvancement();return}
 if(advDraft&&el.dataset.adv){let k=el.dataset.adv;advDraft[k]=el.type==='checkbox'?el.checked:el.value;return}
}

renderMoveCard=function(c,m){let id=NR_resId(m.id),res=c.resources?.[id],custom=m.id.startsWith('custom:'),ef=custom?c.customMoves.find(x=>'custom:'+x.id===m.id)?.effects:[];let meta=(NR_COREDATA[m.name]||{}),limited=res?.max>0;return `<div class="item nr-move-card"><div class="row start"><div><h4>${esc(m.name)}</h4><span class="badgetext">${esc(m.source||'Move')}</span>${limited?`<p class="tiny">${res.remaining}/${res.max} uses · ${esc(NR_RESETS[res.reset]||res.reset)}</p>`:''}</div><div class="actions">${NR_rollButtonForMove(m)}${btn('Details','nr-move-info','sm quiet',`data-id="${esc(m.id)}"`)}</div></div><p>${esc(meta.trigger||m.hint||m.description||'GM adjudicates the move.')}</p>${ef?.length?`<div class="chips">${NR_effectListSmall(ef)}</div>`:''}${limited?`<div class="nr-dots">${Array.from({length:Math.min(res.max,12)},(_,i)=>`<button class="nr-dot ${i<res.remaining?'on':''}" data-action="nr-resource-tick" data-id="${esc(res.id)}" data-idx="${i}"></button>`).join('')}</div>`:''}</div>`}

function NR_activateMove(id){let c=active(),m=getMoveRows(c).find(x=>x.id===id);if(!m){banner('Move not acquired');return}let res=c.resources[NR_resId(id)];if(res&&res.remaining<=0){banner('This move is out of uses; recharge according to its rule.');return}let cm=c.customMoves.find(x=>'custom:'+x.id===id);let costs=/mark (?:\d+(?:[-–]\d+)?|a|one|some) conditions?/i.test(m.hint||'');openModal('Use: '+m.name,`<div class="stack"><p>${esc(m.hint||'')}</p>${res?`<div class="guide">${res.remaining}/${res.max} uses · ${esc(NR_RESETS[res.reset]||res.reset)}</div>`:''}${costs?`<label class="formfield">Conditions required by this use (ask GM if variable)<select class="input" id="nr-move-cost"><option value="0">None / GM resolves</option><option value="1">1 Condition</option><option value="2">2 Conditions</option><option value="3">3 Conditions</option></select></label>`:''}${cm?.effects?.length?`<div class="chips">${NR_effectListSmall(cm.effects)}</div>`:''}<div class="actions">${btn('Confirm use','nr-move-confirm','primary',`data-id="${esc(id)}"`)}${btn('Configure counter','nr-resource-edit','quiet',`data-id="${esc(id)}"`)}${btn('Cancel','modal-close','quiet')}</div></div>`,true)}
function NR_confirmMove(id){let c=active(),m=getMoveRows(c).find(x=>x.id===id);if(!m)return;let r=c.resources[NR_resId(id)];if(r&&r.remaining<=0){banner('No uses remaining.');return}let cost=Number(document.querySelector('#nr-move-cost')?.value||0);if(cost){let available=NR_COND.filter(k=>c.conditions[k]===0);if(available.length<cost){banner('Not enough clear Conditions. GM may allow locking marked ones.');return}for(let i=0;i<cost;i++)NR_condSet(c,available[i],1)}
 if(r){if(r.reset==='activation'&&r.remaining<=0)r.remaining=r.max;else r.remaining=Math.max(0,r.remaining-1)}let cm=c.customMoves.find(x=>'custom:'+x.id===id);if(cm)NR_applyGroup(c,cm.effects||[],cm.name);closeModal();render();banner(`Used ${m.name}${r?' · '+r.remaining+' remaining':''}.`)}
function NR_resourceEditor(id){let c=active();if(!c)return;let actual=id.startsWith('move:')?id:NR_resId(id),ex=c.resources[actual],name=getMoveRows(c).find(x=>NR_resId(x.id)===actual)?.name||ex?.name||'Resource';openModal('Configure limited-use track',`<form data-form="nr-resource" class="stack"><input type="hidden" name="id" value="${esc(actual)}">${inputField('Track name','name',ex?.name||name)}<div class="f3">${inputField('Max uses','max',ex?.max??0,'0','type="number" min="0" max="100"')}${inputField('Uses remaining','remaining',ex?.remaining??0,'0','type="number" min="0" max="100"')}${selectField('Recharge trigger','reset',Object.entries(NR_RESETS).map(([value,label])=>({value,label})),ex?.reset||'manual')}</div>${textField('Notes / specific rule','notes',ex?.notes||'','What spends a use? When is it restored?') }<div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">Save track</button></div></form>`,true)}
function NR_resourceManager(){let c=active();if(!c)return;NR_syncResources(c);openModal('Limited resources & recovery',`<div class="stack"><div class="guide">Tracks are separate. A camp restores only camp-based tracks; session and scene counters reset independently. Consumables never automatically recharge.</div>${Object.values(c.resources).map(r=>`<div class="item"><div class="row"><b>${esc(r.name)}</b><span>${r.remaining}/${r.max}</span></div><p class="tiny">${esc(NR_RESETS[r.reset]||r.reset)}</p><div class="actions">${btn('Use','nr-resource-spend','sm',`data-id="${esc(r.id)}"`)}${btn('Restore 1','nr-resource-gain','sm',`data-id="${esc(r.id)}"`)}${btn('Edit','nr-resource-edit','sm quiet',`data-id="${esc(r.id)}"`)}</div></div>`).join('')||'<p>No move resources yet.</p>'}<h3>Item charges</h3>${c.items.filter(it=>it.uses>0).map(it=>`<div class="item"><div class="row"><b>${esc(it.name)}</b><span>${it.uses-it.spent}/${it.uses}</span></div><p class="tiny">${esc(NR_RESETS[it.reset]||it.reset)}</p>${btn('Use','nr-item-use','sm',`data-id="${esc(it.id)}"`)} ${btn('Edit','nr-item-edit','sm quiet',`data-id="${esc(it.id)}"`)}</div>`).join('')||'<p class="small muted">No limited equipment.</p>'}</div>`,true)}
function NR_genericRollTotal(c,stat,mode,customBonus=0,isRogue=false){let d=NR_calc(c),base=rollBase(mode,isRogue);let baseBonus=stat in d.stats?d.stats[stat]:customBonus;let addition=Number(d.moveBonus)||0;let extraDie=null;if(c.nextMove?.die){try{extraDie=NR_rollExpr(c.nextMove.die);addition+=extraDie.total}catch(e){}}addition+=Number(c.nextMove?.flat)||0;let total=base.base+baseBonus+addition;return{total,raw:base.raw,used:base.used,bonus:baseBonus+addition,extraDie:extraDie?.detail||'',mode}}
rollModal=function(name,stat,moveId='',cast=null){NR_pendingMoveId=moveId||'';NR_activeRoll=cast?.id||'';NR_oldRoll(name,stat,moveId,cast);let el=document.querySelector('#rollResults');if(el){el.innerHTML=`<div class="tiny">The next roll will apply active bonuses and automatic XP on 6−. A move with no dice will instead offer its use/decision controls.</div>`}}
executeRoll=function(){let c=active();if(!c)return;let result=document.querySelector('#rollResults');try{let stat=document.querySelector('#rollStat')?.value||'NONE',mode=document.querySelector('#rollMode')?.value||'normal',castId=document.querySelector('[data-action="roll-now"]')?.dataset.cast||'',spell=c.spells.find(s=>s.id===castId),name=document.querySelector('[data-action="roll-now"]')?.dataset.name||'Move',mod=['QUESTIONS','CONDITIONS','TRAVEL'].includes(stat)?Number(document.querySelector('#rollConditions')?.value||0):0;let calc=NR_calc(c);let extra=calc.moveBonus+(c.nextMove?.flat||0),rogue=mode==='rogue';if(spell){stat=c.klass==='Cleric'||c.klass==='Druid'?'WIS':'INT';let rating=calc.stats[stat]||0;if(Number(spell.mag)>rating){banner('MAG too high for normal casting.');return}mode=Number(spell.mag)===rating?'dis':'normal';rogue=false;}else if(NR_pendingMoveId.endsWith('Spout Lore'))stat='QUESTIONS';
 if(c.nextMove?.adv&&mode!=='rogue'&&!spell)mode=c.nextMove.adv>0?'adv':'dis';let r=rollBase(mode,rogue),statBonus=stat in calc.stats?Number(calc.stats[stat]):mod;let dieB=0,dieDetail='';if(c.nextMove?.die){let rr=NR_rollExpr(c.nextMove.die);dieB=rr.total;dieDetail=rr.detail}let total=r.base+statBonus+extra+dieB;
 let grade=total>=10?'10+ · Strong hit':total>=7?'7–9 · Mixed hit':'6− · GM Move';let id=uid(),record={id,name,total,grade,when:new Date().toISOString(),dice:r.raw,used:r.used,stat,bonus:statBonus+extra+dieB,mode,moveId:NR_pendingMoveId,castId};c.rollHistory.unshift(record);c.rollHistory=c.rollHistory.slice(0,120);
 let xpText='';if(total<=6){NR_gainXP(c,1);xpText=' • +1 XP automatically';}
 c.nextMove={adv:0,flat:0,die:''};
 let ref=NR_COREDATA[name]||{};let hint=total>=10?ref.hit:total>=7?ref.mixed:ref.miss;let status='';if(spell&&total>=7){if(spell.status!=='Approved')status='Effect is still a GM proposal; activation not automatic.';else {let out=NR_applyGroup(c,spell.effects||[],spell.name);status='Approved effects: '+(out.join('; ')||'narrative ruling only');}}
 const charge=c.resources[NR_resId(NR_pendingMoveId)];if(charge&&total>=7){if(charge.remaining>0){charge.remaining--;status+=` · ${charge.remaining}/${charge.max} uses remain`;}else status+=' · WARNING: move counter empty';}
 if(result)result.innerHTML=`<div class="rollresult"><strong>${total}</strong><b>${grade}</b><p>${esc(name)} · ${r.raw.join(' + ')} ${r.used.length===r.raw.length?'':'→ '+r.used.join(' + ')} ${fmt(statBonus+extra+dieB)} (${esc(stat)})${dieDetail?' · '+esc(dieDetail):''}${xpText}</p></div>${hint?`<div class="guide">${esc(hint)}</div>`:''}${spell&&total>=7?`<div class="guide">${esc(status)}${total<10?' · On 7–9 choose a cost/complication or lose a prepared school (Wizard) as appropriate.':''}</div>`:''}${btn('Open character','nr-after-roll','sm quiet')}`;
 save();}catch(e){if(result)result.innerHTML=`<div class="warning">${esc(e.message)}</div>`;}}
function NR_rollDamage(c,it){let formula=it?.damage||'1d4';try{let buff=NR_calc(c),rolled=NR_rollExpr(formula,c.nextDamage?.adv||0);let extra=0,notes=[];for(const expression of buff.damageDice){let a=NR_rollExpr(expression);extra+=a.total;notes.push(a.detail)}if(c.nextDamage?.die){let a=NR_rollExpr(c.nextDamage.die);extra+=a.total;notes.push(a.detail)}let bonus=buff.damBonus+Number(c.nextDamage?.flat||0);let total=Math.max(0,rolled.total+bonus+extra);c.nextDamage={adv:0,flat:0,die:''};c.rollHistory.unshift({id:uid(),name:'Damage: '+(it?.name||'attack'),total,grade:'Damage',when:new Date().toISOString(),dice:[rolled.detail],used:[],stat:'Damage',bonus:bonus+extra,mode:'damage'});c.rollHistory=c.rollHistory.slice(0,120);save();openModal('Damage result',`<div class="rollresult"><strong>${total}</strong><b>${esc(it?.name||'Damage')}</b><p>${esc(rolled.detail)} ${bonus?fmt(bonus):''} ${esc(notes.join('; '))}</p></div><p class="tiny">${it?.tags?.includes('#piercing')?'#piercing bypasses armor.':'Target armor reduces this damage to a minimum of 1.'} Only the GM can decide whether this attack damages the target in the fiction.</p>${btn('Close','modal-close','quiet')}`)}catch(e){banner('Damage formula error: '+e.message)}}
function NR_shopItems(c){let list=[...NR_CATALOG,...NR_customCatalog],q=NR_shopQuery.toLowerCase().trim(),category=NR_shopCategory;
 let found=list.filter(x=>(category==='All'||x.category===category)&&(q.length===0||[x.name,x.description,x.category,x.class].join(' ').toLowerCase().includes(q)));

 </div>`)}

function NR_effectFormRows(){let d=NR_editDraft||NR_spellDraft;let effects=d?.effects||[];return `${effects.map((e,i)=>`<div class="nr-effect-row"><div><strong>${esc(NR_EFFECTS[e.type]?.[0]||e.type)}</strong><p class="tiny">${esc(e.value??'')} ${e.stat?'· '+esc(e.stat):''} · ${esc(e.scope)} · ${esc(e.duration)}</p>${e.description?`<p class="tiny">${esc(e.description)}</p>`:''}</div>${btn('Remove','nr-effect-remove','sm danger',`data-i="${i}"`)}</div>`).join('')||'<div class="tiny">No automatic effects. Add one below, or keep this as a GM-adjudicated narrative ability.</div>'}`}
function NR_effectBuilderBox(){return `<div class="nr-effectbuilder"><h4>Effect builder</h4><div class="f2">${selectField('Effect type','nr-effect-type',Object.entries(NR_EFFECTS).map(([value,x])=>({value,label:x[0]})),'stat_bonus')}${selectField('Trigger / behavior','nr-effect-scope',[{value:'activate',label:'When activated / cast'},{value:'passive',label:'While equipped / ongoing'}],'activate')}</div><div class="f3" style="margin-top:9px">${inputField('Value / dice / tag','nr-effect-value','1','e.g. +1, 1d4, #piercing')}${selectField('Attribute or Condition','nr-effect-stat',[{value:'',label:'Not needed'},...STATS.map(x=>({value:x,label:x})),...NR_COND.map(x=>({value:x,label:x}))],'')}${selectField('Duration / reset','nr-effect-duration',[{value:'instant',label:'Instant / one-time'},{value:'next-roll',label:'Next roll'},{value:'scene',label:'Until scene ends'},{value:'camp',label:'Until Make Camp'},{value:'session',label:'Until session ends'},{value:'manual',label:'Until manually removed'},{value:'equipped',label:'While equipped'}],'instant')}</div>${inputField('Effect note / condition (optional)','nr-effect-note','','E.g. only against undead')}<div class="actions" style="margin-top:10px">${btn('+ Add effect','nr-effect-add','sm primary')}</div><p class="tiny">Stats, armor, damage, HP, conditions, bonuses, and tags are calculated automatically when applicable. Fiction-dependent status and targets are shown for the GM to resolve.</p></div>`}
function NR_captureEditor(){let f=document.querySelector('#nr-object-form'),d=NR_editDraft||NR_spellDraft;if(!f||!d)return;let fd=new FormData(f);for(const k of ['name','desc','kind','damage','tags','armor','strength','uses','reset','quantity','category','status','verbSource','subjectSource','mag','notes','roll','actionCost'])if(fd.has(k))d[k]=String(fd.get(k)||'');d.equipped=fd.get('equipped')==='on';d.damage=d.damage||'';d.effects??=[];}
function NR_objectEditor(type,id=null){let c=active();if(!c)return;let d=null;
 if(type==='item'){let existing=id?c.items.find(x=>x.id===id):null;d=deep(existing||{id:uid(),name:'',desc:'',kind:'Item',damage:'',armor:0,strength:0,tags:[],uses:0,spent:0,reset:'never',equipped:false,quantity:1,effects:[]})}
 if(type==='spell'){let existing=id?c.spells.find(x=>x.id===id):null;let prep=preparedSchools(c);d=deep(existing||{id:uid(),name:'',effect:'',desc:'',category:'Utility',status:'Proposed',verbSource:legalVerbs(c)[0]?legalVerbs(c)[0].school+'|'+legalVerbs(c)[0].verb:'custom|Custom',subjectSource:prep[0]||'custom',mag:0,uses:0,spent:0,reset:'never',effects:[]})}
 if(type==='move'){let existing=id?c.customMoves.find(x=>x.id===id):null;d=deep(existing||{id:uid(),name:'',hint:'',desc:'',roll:'NONE',uses:0,spent:0,reset:'manual',effects:[]})}
 if(!d)return;d._type=type;NR_editDraft=d;NR_drawEditor();}
function NR_drawEditor(){let d=NR_editDraft;if(!d)return;let type=d._type,c=active();let body='';const common=`<div class="f2">${inputField('Name','name',d.name||'','Name')}${selectField('Recharge','reset',Object.entries(NR_RESETS).map(([value,label])=>({value,label})),d.reset||'never')}</div>`;
 if(type==='item')body=`${common}${textField('Description & ruling','desc',d.desc||'','Describe physical properties and special rules.',3)}<div class="f3">${selectField('Item kind','kind',['Weapon','Armor','Shield','Consumable','Focus','Magic item','Artifact','Item','Signature Weapon'],d.kind||'Item')}${inputField('Damage formula','damage',d.damage||'','1d6+1')}${inputField('Tags (comma separated)','tags',Array.isArray(d.tags)?d.tags.join(', '):d.tags||'','#close, #piercing')}</div><div class="f3">${inputField('Armor value','armor',d.armor||0,'0','type="number"')}${inputField('STR requirement','strength',d.strength||0,'0','type="number"')}${inputField('Quantity','quantity',d.quantity||1,'1','type="number" min="1"')}</div><label class="option"><input type="checkbox" name="equipped" ${d.equipped?'checked':''}><span><b>Equipped / providing passive effects</b></span></label>`;
 if(type==='spell'){const vs=legalVerbs(c),schools=preparedSchools(c);body=`${common}<div class="f2">${selectField('Category','category',NR_CATS,d.category||'Utility')}${selectField('Status','status',['Proposed','Approved','Rejected'],d.status||'Proposed')}</div><div class="f2">${selectField('Verb','verbSource',vs.length?vs.map(x=>({value:x.school+'|'+x.verb,label:x.verb+' · '+x.school})):[{value:'custom|Custom',label:'Custom (GM)'}],d.verbSource)}${selectField('Substance','subjectSource',schools.length?schools.map(x=>({value:x,label:SCHOOL[x].substance+' · '+x})):[{value:'custom',label:'Custom (GM)'}],d.subjectSource)}</div><div class="f2">${selectField('GM-approved MAG','mag',[0,1,2,3,4,5],d.mag??0)}${selectField('Roll stat','roll',['INT','WIS','CHA','STR','DEX'],d.roll||'INT')}</div>${textField('Custom desired effect','desc',d.desc||d.effect||'','What happens? Who or what is affected, duration, range, limitations?',4)}${textField('GM ruling','notes',d.notes||'','Agreed magnitude, restrictions, limitations and consequences.',2)}`;}
 if(type==='move')body=`${common}${textField('When and what it does','desc',d.desc||d.hint||'','Trigger, range, effects, limitations, and costs.',5)}${selectField('Roll stat','roll',[{value:'NONE',label:'No roll / move is resolved narratively'},{value:'CHOICE',label:'Choose stat'},...STATS.map(x=>({value:x,label:'+'+x})),{value:'CONDITIONS',label:'Number of Conditions marked'},{value:'ROGUE',label:'Rogue d8+d6'}],d.roll||'NONE')}`;
 let charges=`<div class="f3">${inputField('Maximum uses (0 = unlimited)','uses',d.uses||0,'0','type="number" min="0" max="100"')}${inputField('Uses spent','spent',d.spent||0,'0','type="number" min="0" max="100"')}${inputField('Additional activation cost','actionCost',d.actionCost||'','e.g. mark Condition')}</div>`;
 openModal((d.id&&([...(c.items||[]),...(c.spells||[]),...(c.customMoves||[])].some(x=>x.id===d.id))?'Edit ':'Create ')+type,`<form id="nr-object-form" data-form="nr-object" class="stack"><div class="guide">Choose the details and effects of this ${esc(type).toLowerCase()}.</div>${body}${charges}<h3>Attached effects (${d.effects?.length||0})</h3><div id="nr-editor-effects">${NR_effectFormRows()}</div>${NR_effectBuilderBox()}<div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary" type="submit">Save ${esc(type)}</button></div></form>`,true)}
function NR_commitEditor(f){let d=NR_editDraft,c=active();if(!d||!c)return;NR_captureEditor();let data=new FormData(f);let type=d._type;if(!d.name?.trim()){banner('Please give this '+type+' a name');return}d.name=d.name.trim().slice(0,170);d.uses=NR_number(data.get('uses'),0,100);d.spent=NR_number(data.get('spent'),0,d.uses);d.reset=String(data.get('reset')||'never');d.effects=d.effects||[];
 d.armor=NR_number(d.armor,0,20);d.strength=NR_number(d.strength,0,6);d.quantity=NR_number(d.quantity,1,999);d.tags=String(d.tags||'').split(',').map(x=>x.trim()).filter(Boolean);d.desc=String(d.desc||'').slice(0,8000);
 if(type==='spell'){d.mag=NR_number(d.mag,0,5);d.status=d.status||'Proposed';d.effect=d.desc;d.verb=d.verbSource?.split('|')[1]||'Custom';d.substance=SCHOOL[d.subjectSource]?.substance||'Custom';d.category=d.category||'Utility';}
 if(type==='move'){d.roll=d.roll||'NONE';d.hint=d.desc;d.source='Custom';}
 delete d._type;let arr=type==='spell'?c.spells:type==='move'?c.customMoves:c.items;let i=arr.findIndex(x=>x.id===d.id);if(i>=0)arr[i]=d;else arr.push(d);NR_editDraft=null;closeModal();NR_normalize(c);render();banner(type+' saved with '+d.effects.length+' effect(s).')}
function NR_addEffect(){let d=NR_editDraft;if(!d)return;NR_captureEditor();let type=document.querySelector('#nr-effect-type')?.value||'custom',scope=document.querySelector('#nr-effect-scope')?.value||'activate',value=document.querySelector('#nr-effect-value')?.value||'',stat=document.querySelector('#nr-effect-stat')?.value||'',duration=document.querySelector('#nr-effect-duration')?.value||'instant',description=document.querySelector('#nr-effect-note')?.value||'';
 if(type==='stat_bonus'&&!STATS.includes(stat)){banner('Choose an attribute for a stat bonus.');return}if(['condition_mark','condition_clear','condition_lock','condition_unlock'].includes(type)&&stat&&!NR_COND.includes(stat)){banner('Choose a Condition or leave blank for automatic selection.');return}
 if(['stat_bonus','armor_bonus','max_hp_bonus','damage_bonus','move_bonus','temp_hp','heal_flat','damage_self','xp_gain','treasure_gain'].includes(type)&&!Number.isFinite(Number(value))){banner('This effect needs a numeric value.');return}
 if(scope==='passive'&&['heal_flat','heal_missing_half','heal_max_half','xp_gain','treasure_gain','condition_mark','condition_clear','condition_lock','condition_unlock','damage_self'].includes(type)){banner('One-time effects cannot be passive. Choose activation.');return}
 d.effects.push({id:uid(),type,value,stat,scope,duration,description});NR_drawEditor()}
function NR_spellSummary(c,s){return `<div class="item"><div class="row start"><div><h4>${esc(s.name)}</h4><p class="meta">${esc(s.verb||'Custom')} + ${esc(s.substance||'Custom')} · MAG ${s.mag} · ${esc(s.category||'Utility')}</p></div><div class="actions">${badge(s.status||'Proposed',s.status==='Approved'?'green':'gold')}${btn('⚄ Cast','cast-spell','sm primary',`data-id="${esc(s.id)}"`)}${btn('Edit','nr-spell-edit','sm quiet',`data-id="${esc(s.id)}"`)}</div></div><p>${esc(s.effect||s.desc||'')}</p><div class="chips">${NR_effectListSmall(s.effects||[])}</div>${s.uses>0?`<div class="tiny">${s.uses-s.spent}/${s.uses} uses · ${esc(NR_RESETS[s.reset]||s.reset)}</div>`:''}</div>`}
renderMagic=function(c){let html=NR_oldMagic(c),spells=Array.isArray(c.spells)?c.spells:[];let oldChunk=html.match(/<div class="list">(?:.*?)<\/div>`/); // keep existing prep, replace spell cards through another compact section
 return html+`<section class="panel" style="margin-top:16px"><div class="row start"><div><h3>Automated spell effects</h3><p class="small muted">Build a verb + substance spell, then attach explicit effects. The GM sets the MAG; only approved spells apply automated effects after successful rolls.</p></div>${btn('+ Build detailed spell','nr-spell-new','sm primary')}</div><div class="list">${spells.map(s=>`<div class="row"><div><b>${esc(s.name)}</b><p class="tiny">${(s.effects||[]).length} attached effects · ${esc(s.status||'Proposed')}</p></div>${btn('Edit effects','nr-spell-edit','sm quiet',`data-id="${esc(s.id)}"`)}</div>`).join('')||'<p class="muted small">Build a spell to enable automated effects.</p>'}</div></section>`}
function NR_gmNPCStats(role='solitary',size='human',armorTier=0,deadly=false){let base={mob:{hp:3,damage:'1d4'},group:{hp:6,damage:'1d6'},solitary:{hp:12,damage:'1d8'}}[role]||{hp:12,damage:'1d8'};let step=({tiny:-1,human:0,large:1,huge:2,colossal:3}[size]||0)+(deadly?1:0),hp=base.hp+({tiny:0,human:0,large:4,huge:8,colossal:12}[size]||0);let dice=['1d4','1d6','1d8','1d10','1d12','1d12+1d4','1d12+1d6','1d12+1d8'];let index=Math.max(0,dice.indexOf(base.damage)+step);return{hp,damage:dice[Math.min(index,dice.length-1)],armor:armorTier}}
function NR_newNPC(){openModal('Create NPC / monster',`<form class="stack" data-form="nr-npc">${inputField('NPC name / creature','name','','Bandit captain')}${textField('Description','description','','Appearance, motivation, notable behavior',2)}<div class="f3">${selectField('Combat role','role',[{value:'mob',label:'Large group: 3 HP / d4'},{value:'group',label:'Small group: 6 HP / d6'},{value:'solitary',label:'Solitary: 12 HP / d8'}],'solitary')}${selectField('Body size','size',[{value:'tiny',label:'Tiny'},{value:'human',label:'Human-sized'},{value:'large',label:'Cart-sized'},{value:'huge',label:'Larger than cart'},{value:'colossal',label:'Vast / titanic'}],'human')}${selectField('Armor','armor',[0,1,2,3,4],1)}</div><label class="option"><input type="checkbox" name="deadly"><span><b>Especially deadly</b><small>Increase damage die one step</small></span></label><div class="f2">${inputField('Drive','drive','','What do they want?')}${inputField('Resources','resources','','Claws, allies, influence…')}</div><div class="f2">${inputField('Resists','resists','','Arrows, charm, fire…')}${inputField('Escalation Conditions','conditionCount',2,'2','type="number" min="0" max="5"')}</div>${textField('Named escalations / GM Moves','moves','','One per line: Fury — Tear the tower down',4)}<div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">Add NPC</button></div></form>`,true)}
function NR_editNPC(id){let x=NR_gm.npcs.find(n=>n.id===id);if(!x)return;openModal('Edit NPC',`<form class="stack" data-form="nr-npc-edit"><input type="hidden" name="id" value="${esc(id)}">${inputField('Name','name',x.name)}${textField('Description','description',x.description)}<div class="f3">${inputField('Maximum HP','maxHP',x.maxHP,'12','type="number" min="0"')}${inputField('Armor','armor',x.armor,0,'type="number" min="0"')}${inputField('Damage expression','damage',x.damage,'1d8')}</div><div class="f2">${inputField('Drive','drive',x.drive)}${inputField('Resources','resources',x.resources)}</div>${inputField('Resists','resists',x.resists)}${textField('Escalations (one per line)','moves',(x.escalations||[]).map(s=>s.name).join('\n'),'Furious — Destroy barricade',4)}<div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">Save NPC</button></div></form>`,true)}
function NR_newThreat(){openModal('Create a campaign threat',`<form data-form="nr-threat" class="stack">${inputField('Threat name','name','','The Blackened Star')}${inputField('Goal','goal','','What will change for the worse?')}${selectField('Scale','scale',[{value:'Local',label:'Local · around 2–3 developments'},{value:'Regional',label:'Regional · around 4–6 developments'},{value:'World',label:'World · around 7–10 developments'}],'Regional')}${textField('Developments (one per line, in order)','developments','','The mine is sabotaged\nA plague reaches the town\nA gateway opens',5)}${textField('Secrets, involved factions, and scenes','notes','','GM-only notes',4)}<div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">Save threat</button></div></form>`,true)}
function NR_gmLog(text){NR_gm.history.unshift({id:uid(),when:new Date().toISOString(),text});NR_gm.history=NR_gm.history.slice(0,250)}
function NR_npcCard(x){return `<div class="item"><div class="row start"><div><h4>${esc(x.name)}</h4><p class="meta">${esc(x.role||'NPC')} · ${esc(x.drive||'No drive')}</p></div>${btn('Use in scene','nr-encounter-add','sm primary',`data-id="${esc(x.id)}"`)}</div><p>${esc(x.description||'')}</p><div class="chips">${badge(x.damage+' dmg')}${badge(x.maxHP+' HP')}${badge(x.armor+' armor')}${x.resists?badge('Resists: '+x.resists):''}</div><div class="actions" style="margin-top:12px">${btn('Edit','nr-npc-edit','sm quiet',`data-id="${esc(x.id)}"`)}${btn('Delete','nr-npc-delete','sm danger',`data-id="${esc(x.id)}"`)}</div></div>`}
function NR_encounterActor(x){let defeated=x.hp<=0||x.escalations?.every(a=>a.marked)&&x.escalations.length>0;return `<div class="item"><div class="row start"><div><h4>${esc(x.name)} ${defeated?badge('Defeated','red'):''}</h4><p class="tiny">Armor ${x.armor} · ${esc(x.damage)} dmg</p></div><div class="nr-count">${x.hp}/${x.maxHP} HP</div></div><div class="progress hp"><i style="width:${Math.max(0,100*x.hp/Math.max(1,x.maxHP))}%"></i></div><div class="actions">${btn('−1 HP','nr-enc-hp','sm',`data-id="${esc(x.id)}" data-step="-1"`)}${btn('−5 HP','nr-enc-hp','sm',`data-id="${esc(x.id)}" data-step="-5"`)}${btn('+1 HP','nr-enc-hp','sm',`data-id="${esc(x.id)}" data-step="1"`)}${btn('⚄ Damage','nr-enc-roll','sm primary',`data-id="${esc(x.id)}"`)}${btn('Hit it','nr-enc-hit','sm',`data-id="${esc(x.id)}"`)}${btn('Remove','nr-enc-remove','sm danger',`data-id="${esc(x.id)}"`)}</div>${(x.escalations||[]).length?`<div class="divider"></div><p class="badgetext">Escalation Conditions</p><div class="stack">${x.escalations.map((a,i)=>`<label class="nr-check"><input type="checkbox" data-action="nr-enc-cond" data-id="${esc(x.id)}" data-i="${i}" ${a.marked?'checked':''}><span>${esc(a.name||'Escalation '+(i+1))}</span></label>`).join('')}</div>`:''}</div>`}
function NR_encounterUI(){return `<div class="stack"><div class="row start"><div><h3>Encounter · ${esc(NR_gm.scene)}</h3><p class="small muted">Freeform fiction-first combat. No artificial initiative order; the GM rolls NPC damage and manages consequences.</p></div><div class="actions">${btn('+ NPC','nr-addnpc','sm')}${btn('New scene','nr-nextscene','sm primary')}${btn('Clear encounter','nr-enc-clear','sm danger')}</div></div><div class="nr-catalog-grid">${NR_gm.encounter.map(NR_encounterActor).join('')||'<div class="empty">No active opponents. Add an NPC from the roster below.</div>'}</div><h3>Player characters on this device</h3><div class="nr-catalog-grid">${state.characters.map(c=>`<div class="item"><div class="row"><b>${esc(c.name||'Unnamed')}</b>${badge(c.klass+' Lv'+c.level)}</div><p>${c.hp}/${maxHP(c)} HP · ${NR_calc(c).armor} Armor · ${NR_COND.filter(k=>c.conditions[k]).length} Conditions</p><div class="actions">${btn('−1 HP','nr-pc-hp','sm',`data-id="${esc(c.id)}" data-step="-1"`)}${btn('+1 HP','nr-pc-hp','sm',`data-id="${esc(c.id)}" data-step="1"`)}${btn('Sheet','nr-pc-switch','sm quiet',`data-id="${esc(c.id)}"`)}</div></div>`).join('')||'<p class="small muted">Characters made on other devices do not appear here unless imported via JSON.</p>'}</div><h3>NPC roster</h3><div class="nr-catalog-grid">${NR_gm.npcs.map(NR_npcCard).join('')||'<div class="empty">No NPCs yet. The NPC builder calculates starting HP, damage, and armor from Beta v3 guidance.</div>'}</div></div>`}
function NR_threatUI(){return `<div class="stack"><div class="row start"><div><h3>Threats and developments</h3><p class="small muted">Tick developments as consequences or when time passes; the GM decides whether a development happens.</p></div>${btn('+ Threat','nr-addthreat','sm primary')}</div>${NR_gm.threats.map(t=>`<div class="item"><div class="row start"><div><h4>${esc(t.name)}</h4><p>${esc(t.goal)}</p><span class="pill">${esc(t.scale||'Regional')}</span></div><div class="actions">${btn('Advance','nr-threat-step','sm primary',`data-id="${esc(t.id)}"`)}${btn('Back','nr-threat-back','sm quiet',`data-id="${esc(t.id)}"`)}${btn('Delete','nr-threat-delete','sm danger',`data-id="${esc(t.id)}"`)}</div></div><div class="nr-threatsteps">${t.developments.map((s,i)=>`<div class="nr-step ${i<t.progress?'done':''}"><span>${i<t.progress?'✓':i+1}</span>${esc(s)}</div>`).join('')}</div><p class="tiny">${t.progress}/${t.developments.length} developments reached · ${esc(t.notes||'')}</p></div>`).join('')||'<div class="empty">Create a local, regional, or world Threat with named developments.</div>'}</div>`}
function NR_worldUI(){return `<div class="stack"><div class="row start"><div><h3>Campaign & scene</h3><p class="small muted">Notes persist locally; JSON export includes the GM workspace.</p></div>${btn('New scene','nr-nextscene','sm primary')}</div><form data-form="nr-world" class="stack">${inputField('Campaign','campaign',NR_gm.campaign||'')}${inputField('Current scene','scene',NR_gm.scene||'')}<div class="f2">${inputField('Session number','session',NR_gm.session||1,'1','type="number" min="1"')}${inputField('Scene number','sceneNumber',NR_gm.sceneNumber||1,'1','type="number" min="1"')}</div>${textField('GM session notes','notes',NR_gm.notes||'','Scenes, choices, clues, NPC reactions, consequences',10)}<div class="actions"><button class="btn primary">Save campaign notes</button>${btn('Start session','nr-gm-session','sm')}${btn('All players Make Camp','nr-gm-camp','sm quiet')}</div></form><div class="divider"></div><h3>Scene log</h3>${NR_gm.history.slice(0,35).map(h=>`<div class="item"><p class="tiny">${esc(h.when.slice(0,16).replace('T',' '))}</p><p>${esc(h.text)}</p></div>`).join('')||'<p class="muted">No recorded scene changes yet.</p>'}</div>`}
function NR_rulingsUI(){let pending=state.characters.flatMap(c=>(c.spells||[]).map(s=>({c,s}))).filter(x=>x.s.status!=='Approved');return `<div class="stack"><div class="row start"><h3>Spell approvals and rulings</h3>${btn('Add GM ruling','nr-ruling-add','sm primary')}</div><p class="small muted">A spell record's status and MAG belong to the GM. Approved numeric effects become automatic after a successful cast.</p>${pending.map(({c,s})=>`<div class="item"><div class="row"><div><b>${esc(s.name)}</b><p class="tiny">${esc(c.name)} · MAG ${s.mag} · ${esc(s.status)}</p></div><div class="actions">${btn('Approve','nr-approve-spell','sm primary',`data-pc="${esc(c.id)}" data-id="${esc(s.id)}"`)}${btn('Edit','nr-gm-edit-spell','sm quiet',`data-pc="${esc(c.id)}" data-id="${esc(s.id)}"`)}</div></div><p>${esc(s.effect)}</p></div>`).join('')||'<div class="guide">There are no pending spells on characters stored in this browser.</div>'}<h3>Rulings log</h3>${NR_gm.rulings.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.text)}</p>${btn('Remove','nr-ruling-delete','sm danger',`data-id="${esc(x.id)}"`)}</div>`).join('')||'<p class="tiny">Record persistent house rules, magic interpretations, and encounter consequences here.</p>'}</div>`}
function NR_safetyUI(){return `<form class="stack" data-form="nr-safety"><div class="guide">Record only boundaries players have agreed to share. Lines are excluded content; veils may exist offscreen without detail. Any participant can pause or request a change.</div>${textField('Lines — excluded content','lines',NR_gm.safety.lines||'','No depiction at the table',4)}${textField('Veils — fade to black','veils',NR_gm.safety.veils||'','Implied but not depicted',4)}${textField('Agreed procedures / communication','notes',NR_gm.safety.notes||'','X/N/O, pause, rewind, open door',4)}<div class="actions"><button class="btn primary">Save safety agreements</button></div></form>`}
function NR_gmTools(){return `<div class="stack"><h3>GM Moves & useful tables</h3><div class="actions">${btn('Random GM Move','nr-random-gm','primary')}${btn('Roll any dice','nr-gm-dice','sm')}${btn('Random NPC idea','nr-random-npc','sm')}</div><div id="nr-gm-inspiration" class="guide">Use GM Moves when players miss, when the fiction demands it, or when the world advances.</div><div class="nr-catalog-grid">${NR_GM_MOVES.map(x=>`<div class="nr-mini">${esc(x)}</div>`).join('')}</div><div class="divider"></div>${Object.entries(NR_GM_GUIDE).map(([k,v])=>`<details class="nr-details"><summary>${esc(k)}</summary><p>${esc(v)}</p></details>`).join('')}</div>`}
function NR_renderGM(){let sections=[['encounter','Encounters'],['npcs','NPC roster'],['threats','Threats'],['world','Campaign'],['rulings','Rulings'],['tools','GM tools'],['safety','Safety']];let content=NR_gmTab==='encounter'?NR_encounterUI():NR_gmTab==='npcs'?`<div class="stack"><div class="row"><h3>Major NPCs and monsters</h3>${btn('+ Create NPC','nr-addnpc','sm primary')}</div><div class="nr-catalog-grid">${NR_gm.npcs.map(NR_npcCard).join('')||'<div class="empty">No NPCs yet.</div>'}</div></div>`:NR_gmTab==='threats'?NR_threatUI():NR_gmTab==='world'?NR_worldUI():NR_gmTab==='rulings'?NR_rulingsUI():NR_gmTab==='safety'?NR_safetyUI():NR_gmTools();return wrapper('Game Master workspace','Manage the fiction, NPCs, encounters, threat clocks, magic approvals, and campaign records without inventing an initiative system.',`<div class="hero nr-gmhero"><div><span class="eyebrow">GM workspace · Offline</span><h2>${esc(NR_gm.campaign)}</h2><p>Session ${NR_gm.session} · Scene ${NR_gm.sceneNumber}: ${esc(NR_gm.scene)}. The GM decides narrative consequences; counters and rolls are calculated here.</p></div><div class="actions">${btn('⚄ Dice','nr-gm-dice','sm primary')}${btn('Export all','export','sm')}</div></div><div class="tabs nr-scrolltabs">${sections.map(([id,name])=>`<button class="tab ${NR_gmTab===id?'active':''}" data-action="nr-gm-tab" data-value="${id}">${name}</button>`).join('')}</div><section class="panel">${content}</section>`)}
function NR_referenceContent(){let q=NR_rulesQuery.trim().toLowerCase(),category=NR_ruleCategory;let entries=[];
 if(category==='Core'||category==='All')for(const m of CORE_MOVES){let extra=NR_COREDATA[m.name]||{};entries.push({name:m.name,category:'Core',detail:extra.trigger||m.hint,extended:[extra.hit,extra.mixed,extra.miss,extra.tip].filter(Boolean).join(' · '),roll:m.roll})}
 if(category==='Classes'||category==='All')for(const [key,r] of Object.entries(RULES))entries.push({name:key,category:'Class',detail:`Base HP ${r.hp} · Starting move: ${r.startingMove}`,extended:r.startingDescription+' · '+r.paths.map(p=>p.name).join(', ')})
 if(category==='Paths'||category==='All')for(const p of allPaths()){entries.push({name:p.klass+' · '+p.name,category:'Path',detail:p.starter.name+' — '+p.starter.hint,extended:'Starter Path ability.'});for(const m of p.moves)entries.push({name:m.name,category:p.name+' · '+p.klass,detail:m.hint||'Path move',extended: m.roll?'Roll: '+m.roll:'No automatic roll; follow the move trigger.'})}
 if(category==='Magic'||category==='All'){for(const [name,school] of Object.entries(SCHOOL))entries.push({name,category:'School',detail:`Substance: ${school.substance}`,extended:'Verbs: '+school.verbs.join(', ')});for(const [name,desc] of Object.entries(NR_GM_GUIDE))if(['MAG','Spells'].includes(name))entries.push({name,category:'Magic rules',detail:desc,extended:''});}
 if(category==='Equipment'||category==='All')for(const x of NR_CATALOG)entries.push({name:x.name,category:x.category,detail:x.description||'',extended:[x.damage?`Damage ${x.damage}`:'',x.armor?`Armor ${x.armor}`:'',x.tags?.join(' ')||'',x.uses?`${x.uses} uses, recharge ${x.reset}`:''].filter(Boolean).join(' · ')})
 if(category==='GM'||category==='All'){for(const [n,s] of Object.entries(NR_GM_GUIDE))entries.push({name:n,category:'GM reference',detail:s,extended:''});for(const s of NR_GM_MOVES)entries.push({name:s,category:'GM Move',detail:'An option to change or complicate the fiction when the GM is called to act.',extended:''})}
 if(q)entries=entries.filter(x=>[x.name,x.category,x.detail,x.extended].join(' ').toLowerCase().includes(q));return entries.slice(0,180)}
function NR_renderRules(){let categories=['Core','Classes','Paths','Magic','Equipment','GM','All'],records=NR_referenceContent();return wrapper('Rules reference','Moves, Paths, equipment, magic, and GM procedures.',`<div class="panel"><div class="guide">Rules summaries for Dungeon World 2 Beta v3. The GM determines narrative outcomes.</div><div class="tabs" style="margin-top:16px">${categories.map(n=>`<button class="tab ${NR_ruleCategory===n?'active':''}" data-action="nr-rules-cat" data-value="${n}">${n}</button>`).join('')}</div><div class="f2"><div class="formfield"><label>Search reference</label><input class="input" id="nr-rules-input" value="${esc(NR_rulesQuery)}" placeholder="Move, magic school, item, Path, rule…"></div><div class="actions" style="align-self:end">${btn('Search','nr-rules-search','primary')}${btn('Clear','nr-rules-clear','quiet')}</div></div><p class="small muted" style="margin:14px 0">${records.length} matching entries${records.length===180?' (first 180 shown)':''}</p><div class="nr-reference-grid">${records.map(x=>`<details class="nr-details"><summary><strong>${esc(x.name)}</strong> <span class="tiny">${esc(x.category)}</span></summary><p>${esc(x.detail)}</p>${x.extended?`<p class="tiny">${esc(x.extended)}</p>`:''}</details>`).join('')||'<div class="empty">No matching reference. Try another term or category.</div>'}</div></div>`)}
function NR_nextScene(){NR_gm.sceneNumber++;NR_gm.scene=`Scene ${NR_gm.sceneNumber}`;let restored=0;for(const c of state.characters)restored+=NR_recover(c,'scene');NR_gmLog(`Advanced to scene ${NR_gm.sceneNumber}. Refreshed ${restored} scene-based uses.`);render();banner('New scene started. Only scene-based counters were restored.')}
function NR_startSession(){NR_gm.session++;NR_gm.sceneNumber=1;NR_gm.scene='Opening scene';let recovered=0;for(const c of state.characters)recovered+=NR_recover(c,'session');NR_gmLog(`Started session ${NR_gm.session}; restored ${recovered} session-based uses.`);render();banner('New session started.')}
function NR_advanceThreat(id,step){let t=NR_gm.threats.find(x=>x.id===id);if(!t)return;t.progress=NR_number(t.progress+step,0,t.developments.length);if(step>0)NR_gmLog(`Threat ${t.name} advanced: ${t.developments[t.progress-1]||'goal'} `);render()}
function NR_gmDice(){openModal('GM dice roller',`<form class="stack" data-form="nr-gm-roll">${inputField('Dice formula','formula','1d8','2d6+1')}<label class="formfield">Mode<select class="input" name="mode"><option value="normal">Normal</option><option value="adv">Damage advantage</option><option value="dis">Damage disadvantage</option></select></label><div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">⚄ Roll</button></div><div id="nr-gm-roll-result"></div></form>`)}
function NR_ruleShortcuts(){return `<div class="nr-rulesnippet"><h4>Quick rulings</h4>${Object.entries(NR_GM_GUIDE).map(([k,v])=>`<details><summary>${esc(k)}</summary><p>${esc(v)}</p></details>`).join('')}</div>`}
function NR_markAnyCondition(c){let options=NR_COND.filter(k=>c.conditions[k]===0);if(!options.length){banner('All Conditions already marked or locked');return false}let picked=options[0];if(options.length>1){let entered=prompt('Mark which Condition? '+options.join(', '),picked);if(entered===null)return false;picked=entered;if(!options.includes(picked)){banner('Invalid Condition');return false}}NR_condSet(c,picked,1);return true}
function NR_applyGMNpcRoll(id){let x=NR_gm.encounter.find(n=>n.id===id);if(!x)return;try{let rr=NR_rollExpr(x.damage||'1d6');NR_gm.gmRolls.unshift({date:new Date().toISOString(),name:x.name,damage:rr.total});NR_gmLog(`${x.name} damage roll: ${rr.total} (${rr.detail}). Apply armor and conditions to target.`);openModal('NPC damage roll',`<div class="rollresult"><strong>${rr.total}</strong><b>${esc(x.name)}</b><p>${esc(rr.detail)}</p></div><p class="small muted">The GM applies this damage to the target using their armor and any special resistances.</p>${btn('Close','modal-close','quiet')}`)}catch(e){banner(e.message)}}
function NR_sendDamageToNpc(id){let x=NR_gm.encounter.find(n=>n.id===id);if(!x)return;openModal('Damage '+x.name,`<form data-form="nr-hitnpc" class="stack"><input name="id" type="hidden" value="${esc(id)}">${inputField('Incoming damage','raw',0,'5','type="number" min="0" max="999"')}<label class="option"><input name="piercing" type="checkbox"><span>#piercing ignores armor</span></label><div class="guide">Current armor ${x.armor}. Damage is reduced to a minimum of 1 unless armor is bypassed. GM still determines whether any resistance applies.</div><div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">Apply damage</button></div></form>`)}
function NR_gmRulingForm(){openModal('New GM ruling',`<form class="stack" data-form="nr-ruling">${inputField('Ruling title','title','','A flame ward protects against fire')}${textField('Actual approved ruling','text','','Allowed effects, Magnitude, duration, costs and examples',6)}<div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">Save ruling</button></div></form>`)}
function NR_v3Submit(form){let key=form.dataset.form,fd=new FormData(form),g=k=>String(fd.get(k)||''),c=active();let out='Saved';try{
 switch(key){
 case'nr-object':NR_commitEditor(form);return;
 case'nr-resource':{let id=g('id');if(!c)return;let r=c.resources[id]||{id,category:'Move'};r.name=g('name').slice(0,140);r.max=NR_number(g('max'),0,100);r.remaining=NR_number(g('remaining'),0,r.max);r.reset=g('reset');r.notes=g('notes');c.resources[id]=r;break}
 case'nr-damage':{let v=NR_reduceDamage(c,NR_number(g('amount'),0,999),fd.has('piercing'));out=`${v.hpLoss} HP lost, ${v.absorb} temporary HP absorbed, ${v.armor} armor`;break}
 case'nr-heal':c.hp=NR_number(c.hp+Number(g('amount')),0,maxHP(c));break;
 case'nr-npc':{let stats=NR_gmNPCStats(g('role'),g('size'),NR_number(g('armor'),0,4),fd.has('deadly'));NR_gm.npcs.push({id:uid(),name:g('name')||'Unnamed NPC',description:g('description'),role:g('role'),size:g('size'),...stats,maxHP:stats.hp,drive:g('drive'),resources:g('resources'),resists:g('resists'),escalations:(g('moves')||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5).map(s=>({name:s,marked:false})),conditionCount:NR_number(g('conditionCount'),0,5)});let last=NR_gm.npcs.at(-1);while(last.escalations.length<last.conditionCount)last.escalations.push({name:'Escalation '+(last.escalations.length+1),marked:false});out=last.name+' created';break}
 case'nr-npc-edit':{let x=NR_gm.npcs.find(x=>x.id===g('id'));if(!x)return;for(const k of ['name','description','drive','resources','resists','damage'])x[k]=g(k).slice(0,2500);x.maxHP=NR_number(g('maxHP'),0,10000);x.armor=NR_number(g('armor'),0,30);x.escalations=g('moves').split('\n').filter(x=>x.trim()).slice(0,5).map(s=>({name:s.trim(),marked:false}));break}
 case'nr-threat':{let dev=g('developments').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,20);if(!dev.length){banner('Add at least one development.');return}NR_gm.threats.push({id:uid(),name:g('name')||'Unnamed Threat',goal:g('goal'),scale:g('scale'),developments:dev,progress:0,notes:g('notes'),status:'Active'});break}
 case'nr-world':{for(const x of ['campaign','scene','notes'])NR_gm[x]=g(x).slice(0,30000);NR_gm.session=NR_number(g('session'),1,9999);NR_gm.sceneNumber=NR_number(g('sceneNumber'),1,9999);break}
 case'nr-ruling':NR_gm.rulings.unshift({id:uid(),title:g('title'),text:g('text')});break;
 case'nr-safety':for(const k of ['lines','veils','notes'])NR_gm.safety[k]=g(k).slice(0,12000);break;
 case'nr-hitnpc':{let x=NR_gm.encounter.find(x=>x.id===g('id'));if(!x)return;let raw=NR_number(g('raw'),0,999),amount=raw?Math.max(1,raw-(fd.has('piercing')?0:x.armor)):0;x.hp=NR_number(x.hp-amount,0,x.maxHP);NR_gmLog(`${x.name} took ${amount} damage (${raw} raw)`);out=`${x.name}: ${x.hp}/${x.maxHP} HP`;break}
 case'nr-gm-roll':{let r=NR_rollExpr(g('formula'),g('mode')==='adv'?1:g('mode')==='dis'?-1:0);NR_gm.gmRolls.unshift({date:new Date().toISOString(),name:g('formula'),damage:r.total});out=`Rolled ${r.total}: ${r.detail}`;break}
 default:return;
 }
 closeModal();render();banner(out);
 }catch(e){banner('Error: '+e.message)}}
// Rules refinements and common action helpers.
const NR_oldPrepared=preparedSchools;
preparedSchools=function(c){let p=NR_oldPrepared(c);return p.filter(x=>!(c.forgotSchools||[]).includes(x))};
const NR_oldRecover=NR_recover;
NR_recover=function(c,kind){let n=NR_oldRecover(c,kind);if(kind==='camp')c.forgotSchools=[];for(const s of c.spells||[])if(s.reset===kind&&s.uses>0){if(s.spent)n++;s.spent=0}for(const m of c.customMoves||[])if(m.reset===kind&&m.uses>0){if(m.spent)n++;m.spent=0}return n};
const NR_oldReduce=NR_reduceDamage;
NR_reduceDamage=function(c,raw,piercing){if(c.shieldReady){c.shieldReady=0;return{raw:Number(raw)||0,armor:0,absorb:0,hpLoss:0,net:0,shieldBlocked:true}}return NR_oldReduce(c,raw,piercing)};
const NR_oldItemUse=NR_useItem;
NR_useItem=function(id){let c=active(),it=c?.items.find(x=>x.id===id);if(!it)return;let ready=it.uses===0||it.spent<it.uses;if(!ready)return NR_oldItemUse(id);if(it.kind==='Shield'||/shield/i.test(it.name)&&it.uses>0){if(it.uses>0)it.spent++;c.shieldReady=1;render();banner('Shield primed. The next incoming attack can be negated.');return}NR_oldItemUse(id)};
function NR_spendResource(id,mode){let c=active();if(!c)return;let isItem=id.startsWith('item:'),it=isItem?c.items.find(x=>'item:'+x.id===id):null,r=isItem?null:c.resources[id];if(it){it.spent=NR_number(it.spent+(mode==='spend'?1:-1),0,it.uses)}else if(r){r.remaining=NR_number(r.remaining+(mode==='spend'?-1:1),0,r.max)}render()}
function NR_doneCamp(){let c=active();if(!c)return;let r=c.resources[NR_resId('core:Make Camp')];if(r&&r.remaining===0){if(!confirm('Make Camp is normally once per session. Apply another camp with GM override?'))return}campModal()}
const NR_oldSubmitV3=submitForm;
submitForm=function(f){let kind=f.dataset.form;NR_oldSubmitV3(f);if(kind==='camp'){let r=active()?.resources?.[NR_resId('core:Make Camp')];if(r)r.remaining=Math.max(0,r.remaining-1);if(active())active().shieldReady=0;render()}};
function NR_treasureTier(c){let n=c.treasure||0;if(n>=36)return{tier:5,name:'Aristocratic',next:null};if(n>=24)return{tier:4,name:'Rich',next:36};if(n>=14)return{tier:3,name:'Comfortable',next:24};if(n>=6)return{tier:2,name:'Modest',next:14};return{tier:1,name:'Poor',next:6}}
function NR_merchantDialog(){let c=active();if(!c)return;openModal('Treasure & purchasing',`<div class="guide">In the campaign rules, a purchase below Wealth costs no Treasure, at equal Wealth clears one Treasure, and above Wealth is normally unaffordable.</div><p>Current: <b>${NR_treasureTier(c).name}</b> (${c.treasure} Treasure ticks).</p><form data-form="nr-purchase" class="stack">${selectField('Cost tier','tier',[{value:0,label:'Broke'},{value:1,label:'Poor'},{value:2,label:'Modest'},{value:3,label:'Comfortable'},{value:4,label:'Rich'},{value:5,label:'Aristocratic'}],1)}${inputField('What is purchased?','item','','Equipment / service')}<div class="modalfoot">${btn('Cancel','modal-close','quiet')}<button class="btn primary">Purchase</button></div></form>`)}
const NR_oldSubmitPurchase=submitForm;
submitForm=function(f){if(f.dataset.form==='nr-purchase'){let c=active(),d=new FormData(f),cost=Number(d.get('tier')),w=NR_treasureTier(c);if(cost>w.tier){banner('Cost exceeds Wealth: GM negotiation required.');return}if(cost===w.tier){if((c.treasure||0)===0){banner('Not enough Treasure to pay this purchase.');return}c.treasure--;}c.items.push(NR_normalizeItem({id:uid(),name:String(d.get('item')||'Purchase'),desc:'Bought in play',kind:'Item',uses:0,spent:0},false));closeModal();render();banner('Purchase recorded.');return}NR_oldSubmitPurchase(f)};
function NR_useCostFromSpell(c){let key=NR_chooseCondition(c,false);if(!key)key=NR_COND.find(x=>c.conditions[x]===0);if(key){NR_condSet(c,key,1);render();banner('Marked '+key+' for casting cost.')}}
function NR_forgetSchool(c){let opts=preparedSchools(c);if(!opts.length)return;let val=prompt('Forget which prepared school until next Make Camp? '+opts.join(', '),opts[0]);if(!val||!opts.includes(val)){banner('No school forgotten.');return}c.forgotSchools??=[];c.forgotSchools.push(val);render();banner('Forgot '+val+' until Make Camp.')}
function NR_gmNotesAndWorld(){return `<section class="panel" style="margin-top:16px"><h3>Setting reference</h3><div class="f2"><div><h4>Locations</h4>${NR_gm.locations.map(x=>`<div class="item"><b>${esc(x.name)}</b><p>${esc(x.notes)}</p>${btn('Delete','nr-world-delete','sm danger',`data-kind="locations" data-id="${esc(x.id)}"`)}</div>`).join('')||'<p class="tiny">No locations recorded.</p>'}${btn('+ Location','nr-world-add','sm',`data-kind="locations"`)}</div><div><h4>Factions</h4>${NR_gm.factions.map(x=>`<div class="item"><b>${esc(x.name)}</b><p>${esc(x.notes)}</p>${btn('Delete','nr-world-delete','sm danger',`data-kind="factions" data-id="${esc(x.id)}"`)}</div>`).join('')||'<p class="tiny">No factions recorded.</p>'}${btn('+ Faction','nr-world-add','sm',`data-kind="factions"`)}</div></div></section>`}
const NR_oldRenderGM=NR_renderGM;
NR_renderGM=function(){let html=NR_oldRenderGM();if(NR_gmTab==='world')html+=NR_gmNotesAndWorld();return html};
function NR_worldAdd(kind){let name=prompt((kind==='locations'?'Location':'Faction')+' name');if(!name)return;let notes=prompt('Description, secrets or relationships:','')||'';NR_gm[kind].push({id:uid(),name:name.slice(0,160),notes:notes.slice(0,10000)});render()}
function NR_randomNPCHook(){let a=['A haunted pilgrim','A desperate mapmaker','A wounded deserter','A traveling apothecary','A secretive royal agent','An ancient forest guardian','A fortune-hunting cultist','A disgraced knight'];let drives=['seeks lost kin','wants forbidden knowledge','tries to escape a debt','protects a vulnerable village','fears an impending omen','seeks revenge for betrayal'];let note=a[NR_die(a.length)-1]+', who '+drives[NR_die(drives.length)-1]+'.';let x=document.querySelector('#nr-gm-inspiration');if(x)x.textContent=note;else banner(note)}
function NR_action(b){const a=b.dataset.action,id=b.dataset.id,c=active();
 if(a==='nr-gm-tab'){NR_gmTab=b.dataset.value;render();return}
 if(a==='nr-rules-cat'){NR_ruleCategory=b.dataset.value;render();return}
 if(a==='nr-rules-search'){NR_rulesQuery=document.querySelector('#nr-rules-input')?.value||'';render();return}
 if(a==='nr-rules-clear'){NR_rulesQuery='';render();return}
 if(a==='nr-catalog-search-btn'){NR_shopQuery=document.querySelector('#nr-catalog-search')?.value||'';NR_shopCategory=document.querySelector('#nr-category')?.value||'All';render();return}
 if(a==='nr-catalog-clear'){NR_shopQuery='';NR_shopCategory='All';render();return}
 if(a==='nr-catalog-add'){NR_addItemFromCatalog(id);return}
 if(a==='nr-item-builder'){NR_objectEditor('item');return}
 if(a==='nr-item-edit'){NR_objectEditor('item',id);return}
 if(a==='nr-item-use'){NR_useItem(id);return}
 if(a==='nr-item-equip'){let it=c?.items.find(x=>x.id===id);if(it){it.equipped=!it.equipped;render()}return}
 if(a==='nr-item-counter'){let it=c?.items.find(x=>x.id===id);if(it){let current=NR_number(b.dataset.idx,0,it.uses-1)+1;it.spent=it.uses-current;render()}return}
 if(a==='nr-item-damage'){let it=c?.items.find(x=>x.id===id);if(it)NR_rollDamage(c,it);return}
 if(a==='nr-item-delete'){if(!confirm('Remove this item?'))return;c.items=c.items.filter(x=>x.id!==id);render();return}
 if(a==='nr-move-info'){NR_moveInfo(id);return}
 if(a==='nr-activate-move'){NR_activateMove(id);return}
 if(a==='nr-move-confirm'){NR_confirmMove(id);return}
 if(a==='nr-resource-edit'){NR_resourceEditor(id);return}
 if(a==='nr-resource-manager'){NR_resourceManager();return}
 if(a==='nr-resource-spend'||a==='nr-resource-gain'){NR_spendResource(id,a==='nr-resource-spend'?'spend':'gain');return}

/* Nocturne v3.2: secondary local snapshot, installation and save transparency.
   Existing v2/v3 storage keys remain unchanged for non-destructive upgrades. */
const KEEP_DATA_KEYS=['nocturne-dw2-v2-shareable','nocturne-dw2-v3-gm','nocturne-dw2-v3-catalog'];
const KEEP_DB_NAME='nocturne-dw2-pwa-recovery-v1';
let KEEP_dbPromise=null,KEEP_scheduled=null,KEEP_lastSaved=new Date(),KEEP_snapshotReady=false,KEEP_storageIssue='';
function keepOpenDB(){
 if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB unsupported'));
 if(KEEP_dbPromise)return KEEP_dbPromise;
 KEEP_dbPromise=new Promise((resolve,reject)=>{
  let req=indexedDB.open(KEEP_DB_NAME,1);
  req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains('copies'))db.createObjectStore('copies')};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('Database unavailable'));
 });
 return KEEP_dbPromise;
}
async function keepReadSnapshot(){
 let db=await keepOpenDB();return new Promise((resolve,reject)=>{
  let tx=db.transaction('copies','readonly'),req=tx.objectStore('copies').get('current');
  req.onsuccess=()=>resolve(req.result||null);
  req.onerror=()=>reject(req.error||new Error('Cannot read snapshot'));
 });
}
async function keepWriteSnapshot(){
 try{
  let keys={};
  for(let k of KEEP_DATA_KEYS)keys[k]=localStorage.getItem(k);
  if(!keys[KEEP_DATA_KEYS[0]])return;
  let db=await keepOpenDB();
  await new Promise((resolve,reject)=>{
   let tx=db.transaction('copies','readwrite');
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error||new Error('Cannot write snapshot'));
   tx.objectStore('copies').put({keys,createdAt:new Date().toISOString(),format:1},'current');
  });
  KEEP_snapshotReady=true;KEEP_storageIssue='';
 }catch(e){KEEP_snapshotReady=false;KEEP_storageIssue=String(e.message||e)}
}
function keepScheduleSnapshot(){
 KEEP_lastSaved=new Date();
 if(KEEP_scheduled!==null)clearTimeout(KEEP_scheduled);
 KEEP_scheduled=setTimeout(()=>{KEEP_scheduled=null;keepWriteSnapshot()},500);
}
async function keepBoot(){
 // Restoration is intentionally only attempted when the primary character key is absent.
 // This prevents resurrecting deleted characters or overwriting newer localStorage data.
 try{
  let primary=localStorage.getItem(KEEP_DATA_KEYS[0]);
  if(!primary){let snap=await keepReadSnapshot();
   if(snap&&snap.keys&&snap.keys[KEEP_DATA_KEYS[0]]){
    for(const k of KEEP_DATA_KEYS){if(snap.keys[k]!==null&&snap.keys[k]!==undefined)localStorage.setItem(k,snap.keys[k])}
    KEEP_lastSaved=new Date(snap.createdAt||Date.now());
   }
  }
 }catch(e){KEEP_storageIssue=String(e.message||e)}
 init();
 try{await keepOpenDB();KEEP_snapshotReady=!!(await keepReadSnapshot())}catch(e){KEEP_storageIssue=String(e.message||e)}
 keepScheduleSnapshot();
 window.addEventListener('pagehide',()=>{if(KEEP_scheduled!==null)clearTimeout(KEEP_scheduled);keepWriteSnapshot()});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(KEEP_scheduled!==null)clearTimeout(KEEP_scheduled);keepWriteSnapshot()}});
 document.addEventListener('click',keepHandleAppClick,true);
}

save=function(){KEEP_originalSave();keepScheduleSnapshot()};
