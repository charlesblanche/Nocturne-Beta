 let html=`<div class="stack"><p class="small">Characters and GM campaigns are saved automatically on this device.</p>${status}
 <div class="keep-actionrow"><button type="button" class="btn primary sm" data-keep-action="backup">Export full backup</button><button type="button" class="btn sm" data-keep-action="restore">Import full backup</button><button type="button" class="btn sm" data-keep-action="protect">Protect storage</button><button type="button" class="btn sm quiet" data-keep-action="refresh">Refresh status</button></div>
 <p class="small muted">Use separate character and campaign saves below to transfer records between devices. Keep a backup before clearing browser data or removing the app.</p></div>`;
 openModal('Character & campaign saves',html);
}
async function keepHandleAppClick(event){
 let open=event.target.closest('#keepOpenButton');
 let b=event.target.closest('[data-keep-action]');
 if(!open&&!b)return;
 event.preventDefault();event.stopImmediatePropagation();
 if(open){await keepShowAppPanel();return}
 let a=b.dataset.keepAction;
 if(a==='backup'){exportJSON();return}
 if(a==='restore'){document.querySelector('#import-file')?.click();return}
 if(a==='refresh'){await keepShowAppPanel();return}
 if(a==='protect'){
  let msg='';try{
   if(!navigator.storage?.persist){msg='This browser does not offer a persistent-storage request.'}
   else{let allowed=await navigator.storage.persist();msg=allowed?'Protected storage was granted.':'The browser did not grant protected storage. Auto-save still works; keep JSON backups.'}
  }catch(e){msg='Could not request protected storage: '+String(e.message||e)}
  await keepShowAppPanel();banner(msg);
 }
}

'use strict';
const PORT_FORMAT='nocturne-dw2-portable';
const PORT_SCHEMA=1;
const PORT_MAX_BYTES=15*1024*1024;
const PORT_previousPanel=keepShowAppPanel;
const PORT_savedDate=()=>new Date().toISOString().slice(0,10);
function PORT_slug(s){return String(s||'unnamed').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_-]+/ig,'-').replace(/^-+|-+$/g,'').slice(0,55)||'unnamed'}
function PORT_payload(kind,value){let out={format:PORT_FORMAT,schemaVersion:PORT_SCHEMA,kind,exportedAt:new Date().toISOString(),source:'Nocturne v3.2 (DW2 Beta v3)'};
 if(kind==='character')out.character=deep(value);
 if(kind==='gm')out.gm=deep(value);
 if(kind==='catalog')out.catalog=deep(value);
 return out;
}
function PORT_fileName(kind,value){let base=kind==='character'?`Character_${PORT_slug(value.name||value.klass)}`:kind==='gm'?`GM_${PORT_slug(value.campaign||'campaign')}`:'Custom_Items';return `Nocturne_${base}_${PORT_savedDate()}.json`}
function PORT_download(payload,name){const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(url);link.remove()},4000);banner('Save file prepared. Check Downloads or the Files app.');}
async function PORT_shareOrDownload(payload,name){let source=JSON.stringify(payload,null,2);
 try{let file=new File([source],name,{type:'application/json'});if(navigator.canShare?.({files:[file]})&&navigator.share){
  try{await navigator.share({files:[file],title:name,text:'Nocturne character or campaign backup. Save to Files or iCloud Drive to retain a copy.'});return}
  catch(err){if(err?.name==='AbortError')return;}
 }}catch(_){}
 PORT_download(payload,name);
}
function PORT_validateCharacter(c){return c&&typeof c==='object'&&!Array.isArray(c)&&typeof c.id==='string'&&c.id.length>0&&c.id.length<256&&typeof c.klass==='string'&&!!RULES[c.klass]&&Array.isArray(c.paths)&&Array.isArray(c.advancements)&&Array.isArray(c.items||[])&&Array.isArray(c.spells||[])&&Array.isArray(c.journal||[])}
function PORT_validateGM(g){return g&&typeof g==='object'&&!Array.isArray(g)&&g.version===3&&Array.isArray(g.npcs)&&Array.isArray(g.encounter)&&Array.isArray(g.threats)&&Array.isArray(g.rulings)&&Array.isArray(g.history)}
async function PORT_import(kind,file){if(!file)return;
 try{
  if(file.size>PORT_MAX_BYTES)throw Error('This save file is too large (15 MB limit).');
  let src=JSON.parse(await file.text());
  if(src?.format!==PORT_FORMAT||src.schemaVersion!==PORT_SCHEMA||src.kind!==kind)throw Error('Wrong save-file type. Select a '+kind+' export from Nocturne.');
  if(kind==='character'){
   let c=src.character;
   if(!PORT_validateCharacter(c))throw Error('Invalid character record.');
   c=deep(c);normalizeCharacter(c);NR_normalize(c);
   let i=state.characters.findIndex(x=>x.id===c.id);
   if(i!==-1){let selection=prompt(`A character with this save ID already exists (${state.characters[i].name||'Unnamed'}). Type REPLACE to update that character, COPY to keep both, or CANCEL to stop.`, 'REPLACE');
    if(!selection||selection.trim().toLowerCase()==='cancel')return;
    if(selection.trim().toLowerCase()==='replace')state.characters[i]=c;
    else if(selection.trim().toLowerCase()==='copy'){c.id=uid();c.name=(c.name||'Unnamed')+' (copy)';state.characters.push(c)}
    else throw Error('Import canceled: choose REPLACE or COPY.');
   }else{if(state.characters.length>=1000)throw Error('The 1,000-character limit is reached.');state.characters.push(c)}
   state.activeId=c.id;tab='overview';
   render();save();banner('Character imported. Other characters and GM data were preserved.');
  }else if(kind==='gm'){
   let g=src.gm;
   if(!PORT_validateGM(g))throw Error('Invalid GM campaign save.');
   if(!confirm('Replace ONLY the GM workspace on this device with the imported campaign? Characters and custom items will not change.'))return;
   NR_gm={...NR_gm,...deep(g)};tab='gm';NR_gmTab='world';render();save();banner('GM campaign imported. Characters were preserved.');
  }else if(kind==='catalog'){
   if(!Array.isArray(src.catalog)||src.catalog.length>500)throw Error('Invalid custom item library.');
   let incoming=deep(src.catalog).filter(x=>x&&typeof x.name==='string'&&x.name.length<250);
   let selection=prompt('Type MERGE to add these templates, REPLACE to overwrite your library, or CANCEL.','MERGE');
   if(!selection||selection.trim().toLowerCase()==='cancel')return;
   let answer=selection.trim().toLowerCase();
   if(answer==='replace')NR_customCatalog=incoming;
   else if(answer==='merge'){const map=new Map(NR_customCatalog.map(x=>[x.id,x]));for(const x of incoming)map.set(x.id||uid(),x);NR_customCatalog=[...map.values()].slice(0,500)}
   else throw Error('Import canceled: choose MERGE or REPLACE.');
   render();save();banner('Custom templates imported.');
  }
 }catch(err){banner('Import failed: '+(err.message||err));}
}
function PORT_markup(){const cards=state.characters.map(c=>`
 <div class="item" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
   <div><b>${esc(c.name||'Unnamed adventurer')}</b><div class="tiny">${esc(c.klass)} · Level ${Number(c.level)||1}</div></div>
   <div class="actions"><button type="button" class="btn sm" data-port-action="char-share" data-id="${esc(c.id)}">Save / share</button><button type="button" class="btn sm quiet" data-port-action="char-download" data-id="${esc(c.id)}">Download</button></div>
 </div>`).join('')||'<p class="tiny">Create a character to enable individual saves.</p>';
return `<section class="item" style="display:grid;gap:13px;margin-top:9px" id="port-panel">
  <div><h3 style="margin:0 0 5px">Character & campaign files</h3><p class="small muted" style="margin:0">Export or import characters, GM campaigns, and item templates separately.</p></div>
  <div class="actions"><button type="button" class="btn sm primary" data-port-action="import" data-kind="character">Import character</button><button type="button" class="btn sm" data-port-action="import" data-kind="gm">Import GM campaign</button><button type="button" class="btn sm quiet" data-port-action="import" data-kind="catalog">Import item templates</button></div>
  <div class="stack" style="gap:7px"><strong class="small">Individual characters (${state.characters.length})</strong>${cards}</div>
  <div class="item" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>GM campaign</b><div class="tiny">${esc(NR_gm.campaign||'Unnamed campaign')} · Private GM data only</div></div><div class="actions"><button type="button" class="btn sm" data-port-action="gm-share">Save / share</button><button type="button" class="btn sm quiet" data-port-action="gm-download">Download</button></div></div>
  <div class="item" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>Custom item templates</b><div class="tiny">${NR_customCatalog.length} templates</div></div><div class="actions"><button type="button" class="btn sm" data-port-action="catalog-share">Save / share</button><button type="button" class="btn sm quiet" data-port-action="catalog-download">Download</button></div></div>
  <p class="tiny">Save JSON backups in Files or iCloud Drive. Keep GM campaign files private.</p>
  <input type="file" id="port-file-picker" accept=".json,application/json" hidden>
 </section>`;}
keepShowAppPanel=async function(){await PORT_previousPanel();let root=document.querySelector('#modalhost .modal .stack');if(root&&!document.querySelector('#port-panel'))root.insertAdjacentHTML('beforeend',PORT_markup())};
let PORT_requestedKind=null;
document.addEventListener('click',async function(event){let el=event.target.closest('[data-port-action]');if(!el)return;event.preventDefault();event.stopImmediatePropagation();
 let action=el.dataset.portAction;
 if(action==='import'){PORT_requestedKind=el.dataset.kind;document.querySelector('#port-file-picker')?.click();return}
 let kind=action.startsWith('char-')?'character':action.startsWith('gm-')?'gm':'catalog';
 let value=kind==='character'?state.characters.find(c=>c.id===el.dataset.id):kind==='gm'?NR_gm:NR_customCatalog;
 if(!value){banner('That character is no longer available.');return}
 let payload=PORT_payload(kind,value),name=PORT_fileName(kind,value);
 if(action.endsWith('share'))await PORT_shareOrDownload(payload,name);else PORT_download(payload,name);
},true);
document.addEventListener('change',function(event){if(event.target.id!=='port-file-picker')return;event.stopImmediatePropagation();let file=event.target.files?.[0],kind=PORT_requestedKind;event.target.value='';if(kind&&file)PORT_import(kind,file);PORT_requestedKind=null},true);

</script>
<script>
'use strict';

/* Preferences are device-specific and contain no character data. */
const NX_PREF_KEY = 'nocturne-ui-preferences-v1';
const NX_PALETTES = ['nocturne','forest','ember','daylight'];
const NX_BACKGROUNDS = ['aurora','plain','stars','grid'];
const NX_DENSITIES = ['comfortable','compact'];
const NX_SIZES = ['normal','large'];
let NX_preferences = {palette:'nocturne',background:'aurora',density:'comfortable',textSize:'normal'};
function NX_readPreferences(){
  try {const raw=JSON.parse(localStorage.getItem(NX_PREF_KEY)||'null');if(raw && typeof raw==='object')NX_preferences={...NX_preferences,...raw};}catch(_){}
  for(const [key,allow,def] of [['palette',NX_PALETTES,'nocturne'],['background',NX_BACKGROUNDS,'aurora'],['density',NX_DENSITIES,'comfortable'],['textSize',NX_SIZES,'normal']]){
    if(!allow.includes(NX_preferences[key]))NX_preferences[key]=def;
  }
  NX_applyPreferences(false);
}
function NX_applyPreferences(persist=true){
  const root=document.documentElement;
  root.dataset.palette=NX_preferences.palette;
  root.dataset.background=NX_preferences.background;
  root.dataset.density=NX_preferences.density;
  root.dataset.textSize=NX_preferences.textSize;
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',NX_preferences.palette==='daylight'?'#ece6d8':NX_preferences.palette==='forest'?'#0c1815':NX_preferences.palette==='ember'?'#1a1215':'#0b101b');
  if(persist){try{localStorage.setItem(NX_PREF_KEY,JSON.stringify(NX_preferences))}catch(_){}}
}
function NX_themeMenu(){
  const opt=(choices,current)=>choices.map(([val,name])=>`<option value="${esc(val)}" ${val===current?'selected':''}>${esc(name)}</option>`).join('');
  openModal('Appearance',`<form id="nx-appearance-form" class="stack" data-nx-form="appearance">
    <div class="guide">Choose how Nocturne looks on this device. Character and campaign data are not affected.</div>
    <div class="f2"><div class="formfield"><label for="nx-palette">Interface colors</label><select class="input" id="nx-palette" name="palette">${opt([['nocturne','Midnight violet'],['forest','Forest green'],['ember','Ember red'],['daylight','Daylight parchment']],NX_preferences.palette)}</select></div>
    <div class="formfield"><label for="nx-background">Background</label><select class="input" id="nx-background" name="background">${opt([['aurora','Soft glow'],['plain','Plain'],['stars','Starfield'],['grid','Subtle grid']],NX_preferences.background)}</select></div></div>
    <div class="f2"><div class="formfield"><label for="nx-density">Layout spacing</label><select class="input" id="nx-density" name="density">${opt([['comfortable','Comfortable'],['compact','Compact']],NX_preferences.density)}</select></div>
    <div class="formfield"><label for="nx-textSize">Text size</label><select class="input" id="nx-textSize" name="textSize">${opt([['normal','Standard'],['large','Larger']],NX_preferences.textSize)}</select></div></div>
    <div class="modalfoot"><button type="button" class="btn quiet" data-nx-action="appearance-cancel">Cancel</button><button class="btn primary" type="submit">Save appearance</button></div>
  </form>`,false);
}
// The Appearance button is in the permanent header, so no character is required.
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-nx-action]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();
  if(b.dataset.nxAction==='appearance-open')NX_themeMenu();
  if(b.dataset.nxAction==='appearance-cancel')closeModal();
},true);
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-nx-form="appearance"]');if(!f)return;
  e.preventDefault();e.stopImmediatePropagation();
  const fd=new FormData(f);
  for(const [k,values] of [['palette',NX_PALETTES],['background',NX_BACKGROUNDS],['density',NX_DENSITIES],['textSize',NX_SIZES]]){
    const v=String(fd.get(k)||'');if(values.includes(v))NX_preferences[k]=v;
  }
  NX_applyPreferences();closeModal();banner('Appearance saved.');
},true);
NX_readPreferences();

// Keep available computed STR bonuses relevant to the armor requirement.
const NX_baseCalc=NR_calc;
NR_calc=function(c){
  const result=NX_baseCalc(c);
  let armor=Number(c.armor)||0;
  for(const it of c.items||[]){
    if(!it.equipped)continue;
    const reduction=NR_number(it.armor,0,30),req=NR_number(it.strength,0,6);
    if(reduction>0 && result.stats.STR>=req)armor+=reduction;
  }
  const originalArmor= (Number(c.armor)||0)+(c.items||[]).reduce((sum,it)=>sum+(it.equipped && Number(c.stats.STR)>=NR_number(it.strength,0,6)?NR_number(it.armor,0,30):0),0);
  // Preserve flat or ongoing magical armor bonuses already computed by the original engine.
  result.armor=Math.max(0,result.armor-originalArmor+armor);
  return result;
};

// Preserve the full custom-object form when the user adds another attached effect.
const NX_baseCaptureEditor=NR_captureEditor;
NR_captureEditor=function(){
  NX_baseCaptureEditor();
  if(!NR_editDraft)return;
  const form=document.querySelector('#nr-object-form');if(!form)return;
  const fd=new FormData(form);
  if(fd.has('spent'))NR_editDraft.spent=NR_number(fd.get('spent'),0,NR_number(fd.get('uses'),0,100));
  if(fd.has('equipped'))NR_editDraft.equipped=fd.get('equipped')==='on';
};

// Implement the five rulebook Condition penalties on relevant stat rolls.
const NX_STAT_CONDITION={STR:'Exhausted',DEX:'Frightened',INT:'Angry',WIS:'Distracted',CHA:'Insecure'};
function NX_chooseMode(c,stat,selected,castDis=false,rogue=false){
  let plus=selected==='adv'?1:0,minus=selected==='dis'?1:0;
  if(c?.nextMove?.adv>0)plus++;
  if(c?.nextMove?.adv<0)minus++;
  if(castDis)minus++;
  if(NX_STAT_CONDITION[stat] && (c?.conditions?.[NX_STAT_CONDITION[stat]]||0)>0)minus++;
  return plus>minus?'adv':minus>plus?'dis':(rogue?'rogue':'normal');
}
function NX_rogueRoll(mode){
  // The rules prescribe d8+d6 for a Rogue's skill roll, but do not specify
  // the combined interaction of mixed dice with advantage/disadvantage.
  // Keep the d8 and treat advantage/disadvantage as a second d6 choice.
  const d8=rollDice(8),d6=rollDice(6);
  if(mode==='normal'||mode==='rogue')return{raw:[d8,d6],used:[d8,d6],base:d8+d6};
  const d6extra=rollDice(6),picked=mode==='adv'?Math.max(d6,d6extra):Math.min(d6,d6extra);
  return{raw:[d8,d6,d6extra],used:[d8,picked],base:d8+picked,mixedDieRuling:true};
}
function NX_safeRollDice(mode,rogue){return rogue?NX_rogueRoll(mode):rollBase(mode,false)}

// A per-stat temporary bonus applies to the selected stat, not to unrelated rolls.
const NX_baseEffectApply=NR_effectApply;
NR_effectApply=function(c,e,origin){
  if(e.scope!=='passive'&&e.duration==='next-roll'&&e.type==='stat_bonus'){
    const stat=STATS.includes(e.stat)?e.stat:null;
    if(!stat)return 'A stat is required for this bonus';
    c.nextMove??={adv:0,flat:0,die:''};
    c.nextMove.statMods??=[];
    c.nextMove.statMods.push({stat,value:Number(e.value)||0});
    return `${stat} bonus queued for its next roll`;
  }
  return NX_baseEffectApply(c,e,origin);
};

// Explicitly calculate a single real roll, applying all penalties, bonuses and costs.
executeRoll=function(){
  const c=active();if(!c)return;
  const result=document.querySelector('#rollResults');
  try{
    const rollButton=document.querySelector('[data-action="roll-now"]');
    const castId=rollButton?.dataset.cast||'';
    const spell=(c.spells||[]).find(s=>s.id===castId);
    const moveId=NR_pendingMoveId||'';
    const name=rollButton?.dataset.name||'Move';
    let stat=document.querySelector('#rollStat')?.value||'NONE';
    const selected=document.querySelector('#rollMode')?.value||'normal';
    const calc=NR_calc(c);
    const needsSpecial=['QUESTIONS','CONDITIONS','TRAVEL'].includes(stat);
    let special=needsSpecial?Number(document.querySelector('#rollConditions')?.value||0):0;
    let castDis=false;
    if(spell){
      if(Number(spell.uses)>0&&Number(spell.spent)>=Number(spell.uses)){banner('No spell uses remain.');return;}
      stat=c.klass==='Cleric'||c.klass==='Druid'?'WIS':STATS.includes(spell.roll)?spell.roll:'INT';
      const castingStat=Number(calc.stats[stat])||0;
      if(Number(spell.mag)>castingStat){banner('MAG exceeds the casting stat; negotiate a lesser effect or use a ritual.');return;}
      castDis=Number(spell.mag)===castingStat;
    }
    if(moveId.endsWith('Spout Lore'))stat='QUESTIONS';
    const statBonus=Object.prototype.hasOwnProperty.call(calc.stats,stat)?Number(calc.stats[stat]):special;
    const rogue=selected==='rogue';
    const tracked=moveId?c.resources?.[NR_resId(moveId)]:null;
    if(tracked && tracked.max>0 && tracked.remaining<=0 && !spell){banner('No uses remain for this move. Recharge it or request a GM ruling.');return;}
    const mode=NX_chooseMode(c,stat,spell?(selected==='dis'&&castDis?'normal':selected):(rogue?'normal':selected),castDis,rogue);
    const dice=NX_safeRollDice(mode,rogue);
    const temporary=(c.nextMove?.statMods||[]).filter(x=>x.stat===stat).reduce((n,x)=>n+(Number(x.value)||0),0);
    let added=(Number(calc.moveBonus)||0)+(Number(c.nextMove?.flat)||0)+temporary;
    let extraDie=0,extraDetail='';
    if(c.nextMove?.die){const rr=NR_rollExpr(c.nextMove.die);extraDie=rr.total;extraDetail=rr.detail;}
    const total=dice.base+statBonus+added+extraDie;
    const grade=total>=10?'10+ · Strong hit':total>=7?'7–9 · Mixed hit':'6− · GM Move';
    const record={id:uid(),name,total,grade,when:new Date().toISOString(),dice:dice.raw,used:dice.used,stat,bonus:statBonus+added+extraDie,mode,moveId,castId};
    c.rollHistory??=[];c.rollHistory.unshift(record);c.rollHistory=c.rollHistory.slice(0,120);
    if(total<=6)NR_gainXP(c,1);
    c.nextMove={adv:0,flat:0,die:'',statMods:[]};
    let status=[];
    if(spell){
      if(Number(spell.uses)>0)spell.spent=Math.min(spell.uses,(Number(spell.spent)||0)+1);
      if(total>=7){
        if(spell.status==='Approved')status.push(...NR_applyGroup(c,spell.effects||[],spell.name));
        else status.push('Spell effect requires GM approval');
      }
    }
    let charge=c.resources?.[NR_resId(moveId)];
    if(charge && !spell){
      if(charge.remaining>0){charge.remaining--;status.push(`Uses remaining: ${charge.remaining}/${charge.max}`);}
      else status.push('No charges remain; check the GM ruling');
    }
    if(total>=7 && moveId && c.moveOverrides?.[moveId]){
      status.push(...NR_applyGroup(c,c.moveOverrides[moveId].effects||[],name));
    }
    const info=NR_COREDATA[name]||{};
    const hint=total>=10?info.hit:total>=7?info.mixed:info.miss;
    const notes=[];
    if(NX_STAT_CONDITION[stat]&&(c.conditions[NX_STAT_CONDITION[stat]]||0)>0)notes.push(`${NX_STAT_CONDITION[stat]}: disadvantage`);
    if(castDis)notes.push('MAG equals casting stat: disadvantage');
    if(dice.mixedDieRuling)notes.push('Rogue mixed dice + advantage/disadvantage: suggested GM ruling');
    const rollDetails=`${dice.raw.join(' + ')}${dice.used.length===dice.raw.length?'':' → '+dice.used.join(' + ')} · ${stat} ${fmt(statBonus+added+extraDie)}${extraDetail?' · '+extraDetail:''}`;
    if(result){
      result.innerHTML=`<div class="rollresult" role="status" aria-live="polite"><strong>${total}</strong><b>${grade}</b><p>${esc(name)} · ${esc(rollDetails)}${total<=6?' · +1 XP':''}</p><p class="tiny">${esc(mode==='rogue'?'Rogue 1d8+1d6':mode==='normal'?'Normal':mode==='adv'?'Advantage':'Disadvantage')}</p></div>`+
        (notes.length?`<div class="guide">${esc(notes.join(' · '))}</div>`:'')+
        (hint?`<div class="guide">${esc(hint)}</div>`:'')+
        (status.length?`<div class="guide">${esc(status.join('; '))}</div>`:'')+
        (spell&&total>=7&&total<10?`<div class="guide"><b>Choose a 7–9 consequence</b><div class="actions">${btn('Mark Condition','nr-spell-cost','sm',`data-kind="condition"`)}${c.klass==='Wizard'?btn('Forget prepared school','nr-spell-cost','sm',`data-kind="forget"`):''}${btn('GM twist','nr-spell-cost','sm quiet',`data-kind="twist"`)}</div></div>`:'')+
        btn('Open character','nr-after-roll','sm quiet');
    }
    save();
  }catch(err){if(result)result.innerHTML=`<div class="warning">${esc(err.message)}</div>`;}
};

// Clear tooltip and keyboard focus after opening any dialog.
const NX_oldOpenModal=openModal;
openModal=function(title,content,wide=false){
  NX_oldOpenModal(title,content,wide);
  document.querySelector('#modalhost .modal')?.setAttribute('aria-modal','true');

// Reuse the same validated effects on spells, moves, and regular item builders.
NR_effectBuilderBox=function(){const choices=Object.entries(NR_EFFECTS).filter(([k])=>!['weapon_damage_flat','weapon_damage_die','weapon_tag','weapon_attack_stat','weapon_break','weapon_repair'].includes(k));
 return `<section class="nr-effectbuilder"><h4>Mechanical effect builder</h4><div class="f2"><div class="formfield"><label>Effect</label>${N36_gearSelect('nr-effect-type',choices.map(([k,v])=>[k,v[0]]),'stat_bonus')}</div><div class="formfield"><label>Trigger</label>${N36_gearSelect('nr-effect-scope',[['activate','When activated / cast'],['passive','While equipped / active']],'activate')}</div></div><div id="n36-effect-values" style="margin-top:9px"></div><div class="f2"><div class="formfield"><label>Duration</label>${N36_gearSelect('nr-effect-duration',[['instant','Instant'],['equipped','While equipped (passive)'],['next-roll','Next roll'],['next-attack','Next weapon attack'],['scene','Until scene ends'],['camp','Until Make Camp'],['session','Until session ends'],['manual','Until removed'],['permanent','Permanent (GM-approved)']],'instant')}</div><div class="formfield"><label>Source / restriction (optional)</label><input class="input" name="nr-effect-note" id="nr-effect-note" maxlength="240" placeholder="Why the effect applies"></div></div><div class="actions">${btn('+ Add effect','nr-effect-add','sm primary')}</div><p class="tiny">Choose the attribute, dice, tag, or numeric bonus explicitly. Narrative-only effects are labeled for GM rulings. Weapon-targeted effects prompt for their target on activation.</p></section>`;};
function N36_drawEffectDetail(){const type=document.getElementById('nr-effect-type')?.value||'stat_bonus',holder=document.getElementById('n36-effect-values');if(!holder)return;
 holder.innerHTML=N36_valueControl(N36_EFFECT_KIND[type]||'none','n36-effect');
 const scope=document.getElementById('nr-effect-scope'),duration=document.getElementById('nr-effect-duration');
 const isItem=NR_editDraft?._type==='item';
 if(scope&&!isItem){scope.value='activate';scope.disabled=true;}
 if(scope?.value==='passive'&&duration){duration.value='equipped';duration.disabled=true;}
 else if(duration){duration.disabled=false;}
 if(scope?.value!=='passive'&&['stat_bonus','armor_bonus','max_hp_bonus','tag','resistance'].includes(type)&&duration&&['instant','next-roll'].includes(duration.value))duration.value='scene';
 if(type.startsWith('weapon_')){if(scope){scope.value='activate';scope.disabled=true;}if(duration){duration.disabled=false;if(['instant','next-roll','equipped'].includes(duration.value))duration.value='scene';}}
 else if(scope&&isItem)scope.disabled=false;
}
NR_addEffect=function(){const draft=NR_editDraft;if(!draft)return;NR_captureEditor();const type=document.getElementById('nr-effect-type')?.value||'',kind=N36_EFFECT_KIND[type];if(!kind){banner('Choose a supported effect type.');return;}
 try{const form=document.getElementById('nr-object-form'),fd=new FormData(form),weapon=type.startsWith('weapon_'),scope=weapon?'activate':(draft._type==='item'?String(fd.get('nr-effect-scope')||'activate'):'activate'),duration=scope==='passive'?'equipped':String(fd.get('nr-effect-duration')||'instant');
 if(scope==='passive'&&!N36_SCOPE_OK.has(type))throw Error('This effect must trigger on activation, not passively.');
 const e=N36_getEffectValue(fd,'n36-effect',kind);
 const desc=String(fd.get('nr-effect-note')||'').slice(0,240);
 draft.effects??=[];draft.effects.push({id:uid(),type,scope,duration,value:e.value,stat:e.stat,description:desc});NR_drawEditor();banner('Mechanical effect added.');
 }catch(e){banner(e.message);}
};
// Applied weapon-targeted effects also enter the same mechanical pipeline.
const N36_prevEffectApply=NR_effectApply;
NR_effectApply=function(c,e,origin='Effect'){
 if(e.scope==='activate'&&['instant','next-roll'].includes(e.duration)){
  if(e.type==='move_bonus'){c.nextMove??={adv:0,flat:0,die:''};c.nextMove.flat=(Number(c.nextMove.flat)||0)+(Number(e.value)||0);return `${origin}: Move bonus queued`; }
  if(e.type==='damage_bonus'){c.nextDamage??={adv:0,flat:0,die:''};c.nextDamage.flat=(Number(c.nextDamage.flat)||0)+(Number(e.value)||0);return `${origin}: damage bonus queued`; }
  if(e.type==='damage_die'){c.nextDamage??={adv:0,flat:0,die:''};c.nextDamage.die=[c.nextDamage.die,String(e.value||'')].filter(Boolean).join('+');return `${origin}: damage dice queued`; }
 }
 if(!String(e.type||'').startsWith('weapon_'))return N36_prevEffectApply(c,e,origin);
 const it=NC_item(c,ND_effectWeaponId);if(!it)return 'Select the equipment target first.';
 const map={weapon_damage_flat:'damage_flat',weapon_damage_die:'damage_die',weapon_tag:'tag',weapon_attack_stat:'attack_stat'};
 if(e.type==='weapon_break'){if(!ND_canBreak(it))return `${it.name} resists breaking`;it.broken=true;it.equipped=false;return `${it.name} broken`;}
 if(e.type==='weapon_repair'){it.broken=false;return `${it.name} repaired`;}
 const type=map[e.type]||String(e.type).slice(7);
 if(!N36_WEAPON_EFFECTS[type])return 'Unknown weapon effect';
 const data={name:origin,type,value:e.value,stat:e.stat,duration:e.duration};
 if(type==='attack_stat'&&!N36_STATS.includes(data.value))data.value='INT';
 if(type==='damage_die'||type==='damage_override'){
  if(!/^\d{1,2}d\d{1,3}$/.test(String(data.value)))return 'Invalid damage dice';
 }
 N36_addMod(it,data,e.duration==='permanent');return `${it.name}: ${N36_WEAPON_EFFECTS[type][0]}`;
};
const N36_priorUseItem=NR_useItem;
NR_useItem=function(id){const c=active(),it=NC_item(c,id);if(it?.broken){banner('Broken equipment cannot be activated.');return;}if(it?.effects?.some(e=>String(e.type||'').startsWith('weapon_'))){ND_pickWeaponFor(it.name,'item:'+id,()=>N36_priorUseItem(id));return;}return N36_priorUseItem(id);};
// Wealth information is available on each template. Unspecified prices remain GM-set.
function N36_openShop(id){const c=active(),item=[...NR_CATALOG,...NR_customCatalog].find(x=>x.id===id);if(!c||!item)return;
 const wealth=NR_treasureTier(c),price=N36_priceLabel(item),special=['Magic item','Artifact'].includes(item.category)||price.source.startsWith('GM approval');
 openModal(`Acquire · ${item.name}`,`<form class="stack" data-n36-form="purchase"><input type="hidden" name="template" value="${esc(item.id)}"><div class="guide"><strong>${esc(item.name)}</strong><p>${esc(price.source)}. ${esc(price.cost)}.</p><p>Your Wealth: <b>${esc(wealth.name)}</b>, Treasure: <b>${c.treasure||0}</b>.</p></div><div class="formfield"><label>Agreed purchase Wealth tier</label>${N36_gearSelect('n36-shop-tier',N36_WEALTH,price.tier)}</div><p class="tiny">Below your Wealth: no Treasure spent. Equal Wealth: one Treasure. Above your Wealth: normally unaffordable; requires an explicit GM override.</p><label class="option"><input type="checkbox" name="gmApproval" ${special?'':'checked'}><span>GM has approved this acquisition${special?' (special item)':''}</span></label><label class="option"><input type="checkbox" name="override"><span>GM approved buying above the normal Wealth limit</span></label><div class="actions"><button type="submit" class="btn primary">Confirm purchase</button>${btn('Cancel','modal-close','quiet')}</div></form>`,true);
}
function N36_buyItem(form){const c=active(),fd=new FormData(form),id=String(fd.get('template')||''),template=[...NR_CATALOG,...NR_customCatalog].find(x=>x.id===id);if(!c||!template){banner('The item is unavailable.');return;}
 let tier=String(fd.get('n36-shop-tier')??'');if(!N36_WEALTH.some(([x])=>x===tier)||tier===''){banner('Ask the GM to set an acquisition price before purchasing.');return;}
 const special=['Magic item','Artifact'].includes(template.category)||N36_priceLabel(template).source.startsWith('GM approval');
 if((special||!fd.has('gmApproval'))&&!fd.has('gmApproval')){banner('This acquisition requires GM approval.');return;}
 const wealth=NR_treasureTier(c),tierNum=Number(tier);
 if(tierNum>wealth.tier&&!fd.has('override')){banner('This purchase is above your Wealth. Obtain GM approval or choose a different item.');return;}
 if(tierNum===wealth.tier&&(Number(c.treasure)||0)<1){banner('A purchase at your Wealth tier requires one Treasure.');return;}
 const cost=tierNum===wealth.tier?1:0;
 const item=NR_normalizeItem({...deep(template),id:uid(),desc:template.description||template.desc||'',uses:template.uses||0,spent:0,equipped:false,quantity:1,reset:template.reset||'never',effects:deep(template.effects||[]),wealthTier:tier,acquisition:'purchase',acquisitionNotes:'Bought with '+(cost?'one Treasure':'no Treasure')+(tierNum>wealth.tier?' (GM exception)':'')},false);
 c.treasure=Math.max(0,(Number(c.treasure)||0)-cost);c.items.push(item);
 closeModal();save();render();banner(`${item.name} purchased${cost?' · 1 Treasure spent':''}.`);
}
// Interaction layer: dropdown choices update the actual saved values and mechanics.
document.addEventListener('change',e=>{const t=e.target;
 if(['n36-base-count','n36-base-faces'].includes(t.id)||t.name==='n36-base-flat')N36_syncBaseDamage();
 if(t.hasAttribute('data-n36-tag'))N36_syncTags();
 if(t.id==='n36-mod-kind')N36_drawWeaponValue();
 if(t.id==='n36-mod-permanence'){const d=document.getElementById('n36-mod-duration');if(d)d.disabled=t.value==='permanent';}
 if(t.id==='nr-effect-type')N36_drawEffectDetail();
 if(t.id==='nr-effect-scope'){
  const duration=document.getElementById('nr-effect-duration');if(duration){duration.disabled=t.value==='passive';if(t.value==='passive')duration.value='equipped';else if(duration.value==='equipped')duration.value='scene';}
 }

 if(t.id==='n36-gm-stat-enabled'){let wrap=document.getElementById('n36-gm-stat-wrap');if(wrap)wrap.style.display=t.checked?'':'none';}
 if(t.id==='n36-gear-condition'){const it=NC_item(active(),t.dataset.id);if(!it)return;
  if(t.value==='broken'&&!ND_canBreak(it)){t.value='intact';banner('This equipment cannot ordinarily be broken.');return;}
  it.broken=t.value==='broken';if(it.broken)it.equipped=false;const c=active();if(c)c.hp=Math.min(c.hp,maxHP(c));
  save();N36_statusPage(it.id);banner(it.broken?'Equipment marked broken.':'Equipment repaired.');
 }
},true);
document.addEventListener('submit',e=>{const form=e.target.closest('[data-n36-form]');if(!form)return;e.preventDefault();e.stopImmediatePropagation();
 if(form.dataset.n36Form==='weapon')N36_weaponForm(form);
 if(form.dataset.n36Form==='purchase')N36_buyItem(form);
},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action^="n36-"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();
 if(b.dataset.action==='n36-mod-remove')N36_removeMod(b.dataset.id,b.dataset.mod);
 if(b.dataset.action==='n36-shop')N36_openShop(b.dataset.id);
},true);
// Restore all screens to the same compact, tap-friendly control language.
if(!document.getElementById('n36-design')){
 const el=document.createElement('style');el.id='n36-design';el.textContent=`
 .n36-tags{display:flex;flex-wrap:wrap;gap:7px;padding:6px 0}.n36-tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line,#7775);border-radius:10px;padding:6px 9px;min-height:35px;cursor:pointer;font-size:.85rem}
 .n36-tag input{accent-color:var(--accent,#8a6be7);width:16px;height:16px}.n36-item-options{padding:14px!important;display:grid;gap:10px}
 .n36-damage-control>.f2{margin:5px 0}.n36-stat-override{padding:8px 12px;border:1px solid var(--line,#7775);border-radius:10px}.n36-stat-override .formfield{margin-top:7px}
 #n36-mod-value,#n36-effect-values{padding:8px 0}.n36-damage-control input[type=number],#n36-mod-value input[type=number]{max-width:100%}
 @media(max-width:420px){.n36-damage-control .f2,.n36-item-options .f2{grid-template-columns:1fr}.n36-tag{flex:1 0 auto;justify-content:center}}
 `;document.head.appendChild(el);
}
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{})}</script></body></html>
